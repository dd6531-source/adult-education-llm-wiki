<script>
const articles=[{"id": "00_首頁", "title": "成人教學理論與實務｜LLM Wiki", "text": "# 成人教學理論與實務｜LLM Wiki\n\n> 建立方式：先整合吳明烈教授先前的授課簡報、《112年度成人教育調查》、使用者提供的35頁報告與討論定稿，再建立可檢索 Wiki；HTML 教學簡報依 Wiki 教學路徑編排。\n\n## 學習路徑\n1. [[01_教學的目的與教學學習差異]]：為何「教過」不等於「學會」。\n2. [[02_四大核心學習理論]]：行為、認知、人本、建構主義。\n3. [[03_教學設計與策略]]：認知負荷、學習成果、教學策略。\n4. [[04_成人教學實務原則]]：對象、師生關係、方法、課前課中課後。\n5. [[05_國際成人教學案例]]：歐美與亞洲實務。\n6. [[06_臺灣六大學習場域]]：各場域教學定位。\n7. [[07_樂齡123教案]]：一主題、二活動、三應用。\n8. [[08_學習評量與開放問答]]：反思與評量。\n9. [[09_資料來源與使用說明]]：頁碼對照、界線與注意事項。\n\n## 核心主張\n- 教師是否「教完」不等於學生是否「學會」。\n- 成人教學強調需求、經驗、參與、適性支持與成果回饋。\n- 教學有法，但無定法，貴在得法。\n\n**主要依據：** 使用者上傳 PDF，第1–35頁；延伸教學活動的表述均標為「教學設計」。\n\n## 吳明烈老師授課簡報專題\n- [[10_成人教育學的源起與核心意涵]]\n- [[11_Knowles六項成人學習概念]]\n- [[12_學習動機與參與障礙]]\n- [[13_成人教學方法與九項策略]]\n- [[14_成人教師角色與師生關係]]\n- [[15_世界咖啡館教學法]]\n- [[16_成人教育的社會功能]]\n- [[17_歐美成人教育組織與國際趨勢]]\n- [[18_社區大學的角色與永續經營]]\n- [[19_成人教育調查與資料解讀]]\n- [[20_理論與實務跨教材對照]]\n\n## 來源投影片索引\n網頁版 Wiki 另提供依教材、頁碼及關鍵字搜尋的原始投影片文字索引；原始簡報的圖像與排版請以附件原檔為準。\n", "content": "<h1>成人教學理論與實務｜LLM Wiki<\/h1>\n<blockquote>\n<p>建立方式：先整合吳明烈教授先前的授課簡報、《112年度成人教育調查》、使用者提供的35頁報告與討論定稿，再建立可檢索 Wiki；HTML 教學簡報依 Wiki 教學路徑編排。<\/p>\n<\/blockquote>\n<h2>學習路徑<\/h2>\n<ol>\n<li><a href=\"#01_教學的目的與教學學習差異\" class=\"wikilink\" data-target=\"01_教學的目的與教學學習差異\">教學的目的與教學學習差異<\/a>：為何「教過」不等於「學會」。<\/li>\n<li><a href=\"#02_四大核心學習理論\" class=\"wikilink\" data-target=\"02_四大核心學習理論\">四大核心學習理論<\/a>：行為、認知、人本、建構主義。<\/li>\n<li><a href=\"#03_教學設計與策略\" class=\"wikilink\" data-target=\"03_教學設計與策略\">教學設計與策略<\/a>：認知負荷、學習成果、教學策略。<\/li>\n<li><a href=\"#04_成人教學實務原則\" class=\"wikilink\" data-target=\"04_成人教學實務原則\">成人教學實務原則<\/a>：對象、師生關係、方法、課前課中課後。<\/li>\n<li><a href=\"#05_國際成人教學案例\" class=\"wikilink\" data-target=\"05_國際成人教學案例\">國際成人教學案例<\/a>：歐美與亞洲實務。<\/li>\n<li><a href=\"#06_臺灣六大學習場域\" class=\"wikilink\" data-target=\"06_臺灣六大學習場域\">臺灣六大學習場域<\/a>：各場域教學定位。<\/li>\n<li><a href=\"#07_樂齡123教案\" class=\"wikilink\" data-target=\"07_樂齡123教案\">樂齡123教案<\/a>：一主題、二活動、三應用。<\/li>\n<li><a href=\"#08_學習評量與開放問答\" class=\"wikilink\" data-target=\"08_學習評量與開放問答\">學習評量與開放問答<\/a>：反思與評量。<\/li>\n<li><a href=\"#09_資料來源與使用說明\" class=\"wikilink\" data-target=\"09_資料來源與使用說明\">資料來源與使用說明<\/a>：頁碼對照、界線與注意事項。<\/li>\n<\/ol>\n<h2>核心主張<\/h2>\n<ul>\n<li>教師是否「教完」不等於學生是否「學會」。<\/li>\n<li>成人教學強調需求、經驗、參與、適性支持與成果回饋。<\/li>\n<li>教學有法，但無定法，貴在得法。<\/li>\n<\/ul>\n<p><strong>主要依據：<\/strong> 使用者上傳 PDF，第1–35頁；延伸教學活動的表述均標為「教學設計」。<\/p>\n<h2>吳明烈老師授課簡報專題<\/h2>\n<ul>\n<li><a href=\"#10_成人教育學的源起與核心意涵\" class=\"wikilink\" data-target=\"10_成人教育學的源起與核心意涵\">成人教育學的源起與核心意涵<\/a><\/li>\n<li><a href=\"#11_Knowles六項成人學習概念\" class=\"wikilink\" data-target=\"11_Knowles六項成人學習概念\">Knowles六項成人學習概念<\/a><\/li>\n<li><a href=\"#12_學習動機與參與障礙\" class=\"wikilink\" data-target=\"12_學習動機與參與障礙\">學習動機與參與障礙<\/a><\/li>\n<li><a href=\"#13_成人教學方法與九項策略\" class=\"wikilink\" data-target=\"13_成人教學方法與九項策略\">成人教學方法與九項策略<\/a><\/li>\n<li><a href=\"#14_成人教師角色與師生關係\" class=\"wikilink\" data-target=\"14_成人教師角色與師生關係\">成人教師角色與師生關係<\/a><\/li>\n<li><a href=\"#15_世界咖啡館教學法\" class=\"wikilink\" data-target=\"15_世界咖啡館教學法\">世界咖啡館教學法<\/a><\/li>\n<li><a href=\"#16_成人教育的社會功能\" class=\"wikilink\" data-target=\"16_成人教育的社會功能\">成人教育的社會功能<\/a><\/li>\n<li><a href=\"#17_歐美成人教育組織與國際趨勢\" class=\"wikilink\" data-target=\"17_歐美成人教育組織與國際趨勢\">歐美成人教育組織與國際趨勢<\/a><\/li>\n<li><a href=\"#18_社區大學的角色與永續經營\" class=\"wikilink\" data-target=\"18_社區大學的角色與永續經營\">社區大學的角色與永續經營<\/a><\/li>\n<li><a href=\"#19_成人教育調查與資料解讀\" class=\"wikilink\" data-target=\"19_成人教育調查與資料解讀\">成人教育調查與資料解讀<\/a><\/li>\n<li><a href=\"#20_理論與實務跨教材對照\" class=\"wikilink\" data-target=\"20_理論與實務跨教材對照\">理論與實務跨教材對照<\/a><\/li>\n<\/ul>\n<h2>來源投影片索引<\/h2>\n<p>網頁版 Wiki 另提供依教材、頁碼及關鍵字搜尋的原始投影片文字索引；原始簡報的圖像與排版請以附件原檔為準。<\/p>\n", "category": "基礎與實務"}, {"id": "01_教學的目的與教學學習差異", "title": "教學的目的：從教過到學會", "text": "# 教學的目的：從教過到學會\n\n## 為何需要教學？\n原簡報從「認知適應」與「文化產物」兩個視角提出問題，並提及文化傳承、批判思考與人際連結。（PDF 第2–3頁）\n\n## EJ與Spot的故事\nEJ說已教 Spot 吹口哨，但朋友沒有聽到 Spot 吹出來。EJ答：「我說我教過，沒說牠學會。」（PDF 第18頁）\n\n這則故事引出三項檢核：\n- 學習者有沒有能力、需求與動機？\n- 教法是否適合對方？\n- 有什麼可觀察的證據證明學會？\n\n**不是用故事證明任何實驗成效**，而是作為概念引導。（PDF 第18–20頁）\n\n參見：[[04_成人教學實務原則]]、[[08_學習評量與開放問答]]。\n", "content": "<h1>教學的目的：從教過到學會<\/h1>\n<h2>為何需要教學？<\/h2>\n<p>原簡報從「認知適應」與「文化產物」兩個視角提出問題，並提及文化傳承、批判思考與人際連結。（PDF 第2–3頁）<\/p>\n<h2>EJ與Spot的故事<\/h2>\n<p>EJ說已教 Spot 吹口哨，但朋友沒有聽到 Spot 吹出來。EJ答：「我說我教過，沒說牠學會。」（PDF 第18頁）<\/p>\n<p>這則故事引出三項檢核：<\/p>\n<ul>\n<li>學習者有沒有能力、需求與動機？<\/li>\n<li>教法是否適合對方？<\/li>\n<li>有什麼可觀察的證據證明學會？<\/li>\n<\/ul>\n<p><strong>不是用故事證明任何實驗成效<\/strong>，而是作為概念引導。（PDF 第18–20頁）<\/p>\n<p>參見：<a href=\"#04_成人教學實務原則\" class=\"wikilink\" data-target=\"04_成人教學實務原則\">成人教學實務原則<\/a>、<a href=\"#08_學習評量與開放問答\" class=\"wikilink\" data-target=\"08_學習評量與開放問答\">學習評量與開放問答<\/a>。<\/p>\n", "category": "基礎與實務"}, {"id": "02_四大核心學習理論", "title": "四大核心學習理論", "text": "# 四大核心學習理論\n\n| 理論 | 學習看法 | 教師角色 | 課堂例子 |\n|---|---|---|---|\n| 行為主義 | 觀察外顯行為與回饋 | 行為引導者 | 分步練習、回饋與增強 |\n| 認知主義 | 資訊處理、記憶與理解 | 資訊組織者 | 分段講解、減少無關干擾 |\n| 人本主義 | 重視自我實現、情感與動機 | 陪伴引導者 | 安全尊重的學習氛圍 |\n| 建構主義 | 根據經驗與互動建構意義 | 學習鷹架提供者 | 小組探究與共同解題 |\n\n出處：PDF 第4–9頁。\n\n## 界線\n四種理論是幫助分析教學的視角，並非互斥的教學法，也不是一定要按順序使用。\n\n參見：[[03_教學設計與策略]]、[[07_樂齡123教案]]。\n", "content": "<h1>四大核心學習理論<\/h1>\n<table>\n<thead>\n<tr>\n  <th>理論<\/th>\n  <th>學習看法<\/th>\n  <th>教師角色<\/th>\n  <th>課堂例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>行為主義<\/td>\n  <td>觀察外顯行為與回饋<\/td>\n  <td>行為引導者<\/td>\n  <td>分步練習、回饋與增強<\/td>\n<\/tr>\n<tr>\n  <td>認知主義<\/td>\n  <td>資訊處理、記憶與理解<\/td>\n  <td>資訊組織者<\/td>\n  <td>分段講解、減少無關干擾<\/td>\n<\/tr>\n<tr>\n  <td>人本主義<\/td>\n  <td>重視自我實現、情感與動機<\/td>\n  <td>陪伴引導者<\/td>\n  <td>安全尊重的學習氛圍<\/td>\n<\/tr>\n<tr>\n  <td>建構主義<\/td>\n  <td>根據經驗與互動建構意義<\/td>\n  <td>學習鷹架提供者<\/td>\n  <td>小組探究與共同解題<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>出處：PDF 第4–9頁。<\/p>\n<h2>界線<\/h2>\n<p>四種理論是幫助分析教學的視角，並非互斥的教學法，也不是一定要按順序使用。<\/p>\n<p>參見：<a href=\"#03_教學設計與策略\" class=\"wikilink\" data-target=\"03_教學設計與策略\">教學設計與策略<\/a>、<a href=\"#07_樂齡123教案\" class=\"wikilink\" data-target=\"07_樂齡123教案\">樂齡123教案<\/a>。<\/p>\n", "category": "基礎與實務"}, {"id": "03_教學設計與策略", "title": "教學設計與策略", "text": "# 教學設計與策略\n\n## 認知負荷：讓內容容易理解\n- **內在負荷**：教材本身複雜度。\n- **外在負荷**：呈現方式造成的無關負擔。\n- **有益／增生負荷**：有助組織知識的心智努力。\n設計：將複雜操作拆成小步驟、排除不必要干擾、引導練習與理解。（PDF 第6頁）\n\n## 學習成果的五種面向\n語文訊息、心智技能、認知策略、動作技能、態度。（PDF 第11頁）\n\n## 常見策略\n成人教育學的學習者中心、鷹架策略、三明治教學法、舞台策略、全腦學習、翻轉教學。（PDF 第13頁）\n\n### 三明治教學法\n簡短講述與討論／體驗交替進行，避免連續講課。（PDF 第13頁）\n\n### 九大教學事件\n來源簡報第12頁以 Gagné 的九大教學事件展示從引起注意、說明目標至維持與遷移的教學流程。\n\n參見：[[02_四大核心學習理論]]、[[04_成人教學實務原則]]。\n", "content": "<h1>教學設計與策略<\/h1>\n<h2>認知負荷：讓內容容易理解<\/h2>\n<ul>\n<li><strong>內在負荷<\/strong>：教材本身複雜度。<\/li>\n<li><strong>外在負荷<\/strong>：呈現方式造成的無關負擔。<\/li>\n<li><strong>有益／增生負荷<\/strong>：有助組織知識的心智努力。\n設計：將複雜操作拆成小步驟、排除不必要干擾、引導練習與理解。（PDF 第6頁）<\/li>\n<\/ul>\n<h2>學習成果的五種面向<\/h2>\n<p>語文訊息、心智技能、認知策略、動作技能、態度。（PDF 第11頁）<\/p>\n<h2>常見策略<\/h2>\n<p>成人教育學的學習者中心、鷹架策略、三明治教學法、舞台策略、全腦學習、翻轉教學。（PDF 第13頁）<\/p>\n<h3>三明治教學法<\/h3>\n<p>簡短講述與討論／體驗交替進行，避免連續講課。（PDF 第13頁）<\/p>\n<h3>九大教學事件<\/h3>\n<p>來源簡報第12頁以 Gagné 的九大教學事件展示從引起注意、說明目標至維持與遷移的教學流程。<\/p>\n<p>參見：<a href=\"#02_四大核心學習理論\" class=\"wikilink\" data-target=\"02_四大核心學習理論\">四大核心學習理論<\/a>、<a href=\"#04_成人教學實務原則\" class=\"wikilink\" data-target=\"04_成人教學實務原則\">成人教學實務原則<\/a>。<\/p>\n", "category": "基礎與實務"}, {"id": "04_成人教學實務原則", "title": "成人教學實務原則", "text": "# 成人教學實務原則\n\n核心六原則：了解需求、激發動機、主動參與、適性支持、確認成果、循環精進。（PDF 第20頁）\n\n## 教學對象\n青壯年、退休中高齡、新住民及學習機會不足者、社區居民與志工、線上學習者；需求與方法有所不同。（PDF 第21頁）\n\n## 師生關係\n平等、互動、彼此接受、友誼與合作，而非以競爭為主。（PDF 第22頁）\n\n## 方法與時序\n- 講述與示範：先理解。\n- 討論與分享：再互動。\n- 體驗與應用：後實踐。（PDF 第23頁）\n\n課前了解學員、課中創造參與、課後確認學會。（PDF 第24頁）\n\n參見：[[01_教學的目的與教學學習差異]]、[[07_樂齡123教案]]。\n", "content": "<h1>成人教學實務原則<\/h1>\n<p>核心六原則：了解需求、激發動機、主動參與、適性支持、確認成果、循環精進。（PDF 第20頁）<\/p>\n<h2>教學對象<\/h2>\n<p>青壯年、退休中高齡、新住民及學習機會不足者、社區居民與志工、線上學習者；需求與方法有所不同。（PDF 第21頁）<\/p>\n<h2>師生關係<\/h2>\n<p>平等、互動、彼此接受、友誼與合作，而非以競爭為主。（PDF 第22頁）<\/p>\n<h2>方法與時序<\/h2>\n<ul>\n<li>講述與示範：先理解。<\/li>\n<li>討論與分享：再互動。<\/li>\n<li>體驗與應用：後實踐。（PDF 第23頁）<\/li>\n<\/ul>\n<p>課前了解學員、課中創造參與、課後確認學會。（PDF 第24頁）<\/p>\n<p>參見：<a href=\"#01_教學的目的與教學學習差異\" class=\"wikilink\" data-target=\"01_教學的目的與教學學習差異\">教學的目的與教學學習差異<\/a>、<a href=\"#07_樂齡123教案\" class=\"wikilink\" data-target=\"07_樂齡123教案\">樂齡123教案<\/a>。<\/p>\n", "category": "基礎與實務"}, {"id": "05_國際成人教學案例", "title": "國際成人教學案例", "text": "# 國際成人教學案例\n\n來源歸納四個方向：社區本位、職場培訓、彈性數位、公民與高齡。（PDF 第25頁）\n\n## 歐美\n- 德國民眾高等學校：社區就近學習、語言健康文化與數位能力。\n- 丹麥民眾高等學校：對話、共同生活、文化學習。\n- 英國開放大學：遠距與彈性學習。\n- 美國社區學院：職業技能、教育銜接及社區教育。（PDF 第26頁）\n\n## 亞洲\n- 日本公民館：社區生活與地方參與。\n- 新加坡 SkillsFuture：終身進修與職場技能更新。\n- 韓國終身學習城市：城市資源整合與市民學習。（PDF 第27頁）\n\n## 應用啟示\n國際案例不是實施成效排名；用以比較「在地、彈性、對話、技能與參與」等教學取向。（PDF 第28頁）\n\n參見：[[06_臺灣六大學習場域]]。\n", "content": "<h1>國際成人教學案例<\/h1>\n<p>來源歸納四個方向：社區本位、職場培訓、彈性數位、公民與高齡。（PDF 第25頁）<\/p>\n<h2>歐美<\/h2>\n<ul>\n<li>德國民眾高等學校：社區就近學習、語言健康文化與數位能力。<\/li>\n<li>丹麥民眾高等學校：對話、共同生活、文化學習。<\/li>\n<li>英國開放大學：遠距與彈性學習。<\/li>\n<li>美國社區學院：職業技能、教育銜接及社區教育。（PDF 第26頁）<\/li>\n<\/ul>\n<h2>亞洲<\/h2>\n<ul>\n<li>日本公民館：社區生活與地方參與。<\/li>\n<li>新加坡 SkillsFuture：終身進修與職場技能更新。<\/li>\n<li>韓國終身學習城市：城市資源整合與市民學習。（PDF 第27頁）<\/li>\n<\/ul>\n<h2>應用啟示<\/h2>\n<p>國際案例不是實施成效排名；用以比較「在地、彈性、對話、技能與參與」等教學取向。（PDF 第28頁）<\/p>\n<p>參見：<a href=\"#06_臺灣六大學習場域\" class=\"wikilink\" data-target=\"06_臺灣六大學習場域\">臺灣六大學習場域<\/a>。<\/p>\n", "category": "基礎與實務"}, {"id": "06_臺灣六大學習場域", "title": "臺灣六大成人學習場域", "text": "# 臺灣六大成人學習場域\n\n| 場域 | 對象／定位 | 主要教法與特點 |\n|---|---|---|\n| 樂齡學習 | 55歲以上中高齡者 | 生活化、經驗分享、活動體驗 |\n| 社區大學 | 成人及社區居民 | 走讀、討論、工作坊、公民參與 |\n| 學習型城市 | 全體市民；跨機構策略 | 跨世代共學、學習成果展、城市走讀 |\n| 社區照顧關懷據點 | 社區高齡者 | 健康促進、延緩失能、團體互動 |\n| 長青學苑 | 高齡者，依地方規定 | 系列課程、技能練習、成果展示 |\n| 線上學習 | 各年齡成人；教學形式 | 同步／非同步、影片與線上回饋 |\n\n**重要區分：** 學習型城市屬跨機構推動策略，線上學習屬教學形式，與其他機構不完全同類。（本次討論的比較性解讀）\n\n## 調查數字（僅引用教材，不跨指標比較）\n- 42.82%：成人正規與非正規學習參與比例。\n- 24.06%：65–80 歲參與比例。\n- 71.53%：數位／網路非正式學習比例。\n三項統計定義不同；不能視為同一母群或同一參與率。（PDF 第29–30頁）\n\n參見：[[07_樂齡123教案]]。\n", "content": "<h1>臺灣六大成人學習場域<\/h1>\n<table>\n<thead>\n<tr>\n  <th>場域<\/th>\n  <th>對象／定位<\/th>\n  <th>主要教法與特點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>樂齡學習<\/td>\n  <td>55歲以上中高齡者<\/td>\n  <td>生活化、經驗分享、活動體驗<\/td>\n<\/tr>\n<tr>\n  <td>社區大學<\/td>\n  <td>成人及社區居民<\/td>\n  <td>走讀、討論、工作坊、公民參與<\/td>\n<\/tr>\n<tr>\n  <td>學習型城市<\/td>\n  <td>全體市民；跨機構策略<\/td>\n  <td>跨世代共學、學習成果展、城市走讀<\/td>\n<\/tr>\n<tr>\n  <td>社區照顧關懷據點<\/td>\n  <td>社區高齡者<\/td>\n  <td>健康促進、延緩失能、團體互動<\/td>\n<\/tr>\n<tr>\n  <td>長青學苑<\/td>\n  <td>高齡者，依地方規定<\/td>\n  <td>系列課程、技能練習、成果展示<\/td>\n<\/tr>\n<tr>\n  <td>線上學習<\/td>\n  <td>各年齡成人；教學形式<\/td>\n  <td>同步／非同步、影片與線上回饋<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>重要區分：<\/strong> 學習型城市屬跨機構推動策略，線上學習屬教學形式，與其他機構不完全同類。（本次討論的比較性解讀）<\/p>\n<h2>調查數字（僅引用教材，不跨指標比較）<\/h2>\n<ul>\n<li>42.82%：成人正規與非正規學習參與比例。<\/li>\n<li>24.06%：65–80 歲參與比例。<\/li>\n<li>71.53%：數位／網路非正式學習比例。\n三項統計定義不同；不能視為同一母群或同一參與率。（PDF 第29–30頁）<\/li>\n<\/ul>\n<p>參見：<a href=\"#07_樂齡123教案\" class=\"wikilink\" data-target=\"07_樂齡123教案\">樂齡123教案<\/a>。<\/p>\n", "category": "基礎與實務"}, {"id": "07_樂齡123教案", "title": "樂齡大腦健身房：1・2・3 教學架構", "text": "# 樂齡大腦健身房：1・2・3 教學架構\n\n> 這裡的「1・2・3」是本次簡報採用的**教案編排方式**，不應逕稱通行或經研究驗證的獨立教學理論。\n\n## 1 個主題\n**樂齡大腦健身房——手腦並用，越玩越靈活**。\n\n## 2 個活動（順序已定稿）\n1. **大腦健康知多少**：簡單講述並結合生活問題，說明多動腦、多活動、多互動。\n2. **手腦協調動一動**：教師示範、學員模仿，逐步改變拍手、拍肩、拍腿等動作組合。\n\n## 3 個應用（依最新上傳報告）\n1. 自創一項新的手指操。\n2. 與朋友分享今日學習。\n3. 散步、伸展。\n\nPDF 第31頁列出上述主題、活動與應用；20分鐘時間流程是**本次討論延伸設計**：2分鐘引起動機／8分鐘知識講述／7分鐘動作體驗／2分鐘生活應用／1分鐘回饋。\n\n**教學成效界線：** 活動能觀察參與、理解與動作完成，不能據此宣稱改善記憶力或預防失智。\n\n參見：[[03_教學設計與策略]]、[[08_學習評量與開放問答]]。\n", "content": "<h1>樂齡大腦健身房：1・2・3 教學架構<\/h1>\n<blockquote>\n<p>這裡的「1・2・3」是本次簡報採用的<strong>教案編排方式<\/strong>，不應逕稱通行或經研究驗證的獨立教學理論。<\/p>\n<\/blockquote>\n<h2>1 個主題<\/h2>\n<p><strong>樂齡大腦健身房——手腦並用，越玩越靈活<\/strong>。<\/p>\n<h2>2 個活動（順序已定稿）<\/h2>\n<ol>\n<li><strong>大腦健康知多少<\/strong>：簡單講述並結合生活問題，說明多動腦、多活動、多互動。<\/li>\n<li><strong>手腦協調動一動<\/strong>：教師示範、學員模仿，逐步改變拍手、拍肩、拍腿等動作組合。<\/li>\n<\/ol>\n<h2>3 個應用（依最新上傳報告）<\/h2>\n<ol>\n<li>自創一項新的手指操。<\/li>\n<li>與朋友分享今日學習。<\/li>\n<li>散步、伸展。<\/li>\n<\/ol>\n<p>PDF 第31頁列出上述主題、活動與應用；20分鐘時間流程是<strong>本次討論延伸設計<\/strong>：2分鐘引起動機／8分鐘知識講述／7分鐘動作體驗／2分鐘生活應用／1分鐘回饋。<\/p>\n<p><strong>教學成效界線：<\/strong> 活動能觀察參與、理解與動作完成，不能據此宣稱改善記憶力或預防失智。<\/p>\n<p>參見：<a href=\"#03_教學設計與策略\" class=\"wikilink\" data-target=\"03_教學設計與策略\">教學設計與策略<\/a>、<a href=\"#08_學習評量與開放問答\" class=\"wikilink\" data-target=\"08_學習評量與開放問答\">學習評量與開放問答<\/a>。<\/p>\n", "category": "基礎與實務"}, {"id": "08_學習評量與開放問答", "title": "學習評量與開放式問答", "text": "# 學習評量與開放式問答\n\n## 三種評量面向\n1. **學習參與**：是否願意提問、回應與操作。\n2. **學習成果**：能否說出要點、完成動作、提出生活應用。\n3. **持續改善**：根據節奏、難度、教具與支持需求修正。（PDF 第32頁）\n\n## 三題線上開放式問答\n1. 在成人教學中，為什麼「教師教過了」，不代表「學習者真正學會了」？\n2. 如果你是一位樂齡課程教師，會如何設計活動，讓長輩願意參與並快樂學習？\n3. 臺灣有樂齡學習、社區大學、長青學苑及社區關懷據點等場域，你認為哪一種成人教學方式最值得推廣？為什麼？\n\n資料依據：PDF 第33頁。離線 HTML 僅能在**個別瀏覽器**記錄、複製回答，若需要全班即時彙整，仍需連結 Slido 等線上平台。\n\n參見：[[01_教學的目的與教學學習差異]]。\n", "content": "<h1>學習評量與開放式問答<\/h1>\n<h2>三種評量面向<\/h2>\n<ol>\n<li><strong>學習參與<\/strong>：是否願意提問、回應與操作。<\/li>\n<li><strong>學習成果<\/strong>：能否說出要點、完成動作、提出生活應用。<\/li>\n<li><strong>持續改善<\/strong>：根據節奏、難度、教具與支持需求修正。（PDF 第32頁）<\/li>\n<\/ol>\n<h2>三題線上開放式問答<\/h2>\n<ol>\n<li>在成人教學中，為什麼「教師教過了」，不代表「學習者真正學會了」？<\/li>\n<li>如果你是一位樂齡課程教師，會如何設計活動，讓長輩願意參與並快樂學習？<\/li>\n<li>臺灣有樂齡學習、社區大學、長青學苑及社區關懷據點等場域，你認為哪一種成人教學方式最值得推廣？為什麼？<\/li>\n<\/ol>\n<p>資料依據：PDF 第33頁。離線 HTML 僅能在<strong>個別瀏覽器<\/strong>記錄、複製回答，若需要全班即時彙整，仍需連結 Slido 等線上平台。<\/p>\n<p>參見：<a href=\"#01_教學的目的與教學學習差異\" class=\"wikilink\" data-target=\"01_教學的目的與教學學習差異\">教學的目的與教學學習差異<\/a>。<\/p>\n", "category": "基礎與實務"}, {"id": "09_資料來源與使用說明", "title": "資料來源與使用說明", "text": "# 資料來源與使用說明\n\n## 主資料\n使用者於2026-11-23上傳：《成人教學理論與實務－1201報告》，PDF 共35頁。\n\n- 第1–15頁：成人教學理論、四大學派、認知負荷、教學策略與情境選擇。\n- 第16–24頁：成人教學實務、EJ與Spot、學習者、師生關係與教學方法。\n- 第25–28頁：國外案例。\n- 第29–30頁：臺灣六種場域及教材調查數字。\n- 第31–34頁：樂齡教案、評量、開放問答與結語。\n- 第35頁：原簡報參考資料。\n\n## 原簡報列出的主要引用方向\n吳明烈《成人教學的理論與實務》（2026）、《成人學習理論與實務》（2026）；David Minton《Teaching Skills in Further & Adult Education》摘要；《112年度成人教育調查》成果簡報；以及原檔其他文獻（請見原檔第35頁）。\n\n## 使用限制\n- HTML 教學簡報從以上 Wiki 內容編製，保留來源頁碼。\n- Wiki 的「教學示例、學習提示、時間安排」是為便於初學者理解而添加的教學設計，並非原檔中的新研究發現。\n- 原 PDF 第33頁雖有 QR code 圖像，未將其解讀為目前有效的回覆網址。\n- 不宣稱建置至外部 LLM Wiki 平台；本交付為可離線瀏覽且可後續維護的 Markdown Wiki。\n", "content": "<h1>資料來源與使用說明<\/h1>\n<h2>主資料<\/h2>\n<p>使用者於2026-11-23上傳：《成人教學理論與實務－1201報告》，PDF 共35頁。<\/p>\n<ul>\n<li>第1–15頁：成人教學理論、四大學派、認知負荷、教學策略與情境選擇。<\/li>\n<li>第16–24頁：成人教學實務、EJ與Spot、學習者、師生關係與教學方法。<\/li>\n<li>第25–28頁：國外案例。<\/li>\n<li>第29–30頁：臺灣六種場域及教材調查數字。<\/li>\n<li>第31–34頁：樂齡教案、評量、開放問答與結語。<\/li>\n<li>第35頁：原簡報參考資料。<\/li>\n<\/ul>\n<h2>原簡報列出的主要引用方向<\/h2>\n<p>吳明烈《成人教學的理論與實務》（2026）、《成人學習理論與實務》（2026）；David Minton《Teaching Skills in Further &amp; Adult Education》摘要；《112年度成人教育調查》成果簡報；以及原檔其他文獻（請見原檔第35頁）。<\/p>\n<h2>使用限制<\/h2>\n<ul>\n<li>HTML 教學簡報從以上 Wiki 內容編製，保留來源頁碼。<\/li>\n<li>Wiki 的「教學示例、學習提示、時間安排」是為便於初學者理解而添加的教學設計，並非原檔中的新研究發現。<\/li>\n<li>原 PDF 第33頁雖有 QR code 圖像，未將其解讀為目前有效的回覆網址。<\/li>\n<li>不宣稱建置至外部 LLM Wiki 平台；本交付為可離線瀏覽且可後續維護的 Markdown Wiki。<\/li>\n<\/ul>\n", "category": "基礎與實務"}, {"id": "10_成人教育學的源起與核心意涵", "title": "成人教育學的源起與核心意涵", "text": "# 成人教育學的源起與核心意涵\n\n## 什麼是 Andragogy？\n成人教育學（Andragogy）在教材中解釋為**協助成人學習的科學與藝術**。它不是「只要是成人就完全自主」，而是提醒教學者理解成人經驗、生活角色、學習目的及自我概念。\n\n## 發展脈絡\n- 教材指出，成人教育學一詞可追溯至十九世紀的 Alexander Kapp。\n- 二十世紀的成人教育研究者將概念深化，Malcolm Knowles 使其成為具有影響力的成人學習架構。\n- 比較成人教育學與兒童教育學時，應理解為**不同教學假設與情境的比較**，而非成人與兒童截然二分。\n\n## 在教學現場如何應用？\n1. 課前先詢問「這堂課對你有什麼用？」\n2. 允許學員分享曾經的生活與工作經驗。\n3. 使用真實問題，讓學員選擇練習目標。\n4. 以完成任務、反思與回饋確認學習。\n\n**來源：** 吳明烈《成人教育學的發展源起與理論2026》，第2–7張；《成人教學的理論與實務2026》，第6張。\n\n參見：[[11_Knowles六項成人學習概念]]、[[13_成人教學方法與九項策略]]。\n", "content": "<h1>成人教育學的源起與核心意涵<\/h1>\n<h2>什麼是 Andragogy？<\/h2>\n<p>成人教育學（Andragogy）在教材中解釋為<strong>協助成人學習的科學與藝術<\/strong>。它不是「只要是成人就完全自主」，而是提醒教學者理解成人經驗、生活角色、學習目的及自我概念。<\/p>\n<h2>發展脈絡<\/h2>\n<ul>\n<li>教材指出，成人教育學一詞可追溯至十九世紀的 Alexander Kapp。<\/li>\n<li>二十世紀的成人教育研究者將概念深化，Malcolm Knowles 使其成為具有影響力的成人學習架構。<\/li>\n<li>比較成人教育學與兒童教育學時，應理解為<strong>不同教學假設與情境的比較<\/strong>，而非成人與兒童截然二分。<\/li>\n<\/ul>\n<h2>在教學現場如何應用？<\/h2>\n<ol>\n<li>課前先詢問「這堂課對你有什麼用？」<\/li>\n<li>允許學員分享曾經的生活與工作經驗。<\/li>\n<li>使用真實問題，讓學員選擇練習目標。<\/li>\n<li>以完成任務、反思與回饋確認學習。<\/li>\n<\/ol>\n<p><strong>來源：<\/strong> 吳明烈《成人教育學的發展源起與理論2026》，第2–7張；《成人教學的理論與實務2026》，第6張。<\/p>\n<p>參見：<a href=\"#11_Knowles六項成人學習概念\" class=\"wikilink\" data-target=\"11_Knowles六項成人學習概念\">Knowles六項成人學習概念<\/a>、<a href=\"#13_成人教學方法與九項策略\" class=\"wikilink\" data-target=\"13_成人教學方法與九項策略\">成人教學方法與九項策略<\/a>。<\/p>\n", "category": "吳明烈教材專題"}, {"id": "11_Knowles六項成人學習概念", "title": "Knowles 六項成人學習概念", "text": "# Knowles 六項成人學習概念\n\n吳明烈老師的兩份簡報均整理出 Knowles 的六項重要觀點：\n\n1. **學習需要知道原因**：成人想知道為什麼學。\n2. **自我概念與自我導向**：成人通常希望參與學習決定。\n3. **經驗資源**：既有經驗可以幫助，也可能形成固定成見。\n4. **學習準備度**：與生活角色及發展任務有關。\n5. **問題與生活導向**：成人傾向學習能立即處理的實際問題。\n6. **學習動機**：內在動機重要，但外在因素也可能有影響。\n\n## 轉化成教學設計\n| 概念 | 教師可採取的做法 |\n|---|---|\n| 為何學 | 開場先說明生活上的用途 |\n| 自我導向 | 提供主題、任務或難度的選擇 |\n| 經驗 | 讓學員先說自己的做法，再引進新知 |\n| 準備度 | 將內容連結退休、照顧、工作等情境 |\n| 問題中心 | 選用真實案例並讓學員嘗試解題 |\n| 動機 | 使學員看見進步與成就，給予回饋 |\n\n**來源：** 吳明烈《成人學習理論與實務（2026）》，第7張；《成人教學的理論與實務2026》，第6、11張。\n", "content": "<h1>Knowles 六項成人學習概念<\/h1>\n<p>吳明烈老師的兩份簡報均整理出 Knowles 的六項重要觀點：<\/p>\n<ol>\n<li><strong>學習需要知道原因<\/strong>：成人想知道為什麼學。<\/li>\n<li><strong>自我概念與自我導向<\/strong>：成人通常希望參與學習決定。<\/li>\n<li><strong>經驗資源<\/strong>：既有經驗可以幫助，也可能形成固定成見。<\/li>\n<li><strong>學習準備度<\/strong>：與生活角色及發展任務有關。<\/li>\n<li><strong>問題與生活導向<\/strong>：成人傾向學習能立即處理的實際問題。<\/li>\n<li><strong>學習動機<\/strong>：內在動機重要，但外在因素也可能有影響。<\/li>\n<\/ol>\n<h2>轉化成教學設計<\/h2>\n<table>\n<thead>\n<tr>\n  <th>概念<\/th>\n  <th>教師可採取的做法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>為何學<\/td>\n  <td>開場先說明生活上的用途<\/td>\n<\/tr>\n<tr>\n  <td>自我導向<\/td>\n  <td>提供主題、任務或難度的選擇<\/td>\n<\/tr>\n<tr>\n  <td>經驗<\/td>\n  <td>讓學員先說自己的做法，再引進新知<\/td>\n<\/tr>\n<tr>\n  <td>準備度<\/td>\n  <td>將內容連結退休、照顧、工作等情境<\/td>\n<\/tr>\n<tr>\n  <td>問題中心<\/td>\n  <td>選用真實案例並讓學員嘗試解題<\/td>\n<\/tr>\n<tr>\n  <td>動機<\/td>\n  <td>使學員看見進步與成就，給予回饋<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>來源：<\/strong> 吳明烈《成人學習理論與實務（2026）》，第7張；《成人教學的理論與實務2026》，第6、11張。<\/p>\n", "category": "吳明烈教材專題"}, {"id": "12_學習動機與參與障礙", "title": "成人學習動機與參與障礙", "text": "# 成人學習動機與參與障礙\n\n## 動機：為什麼來學？\n教材列出六項動機：**求知興趣、職業進展、逃避或刺激、社會服務、外界期望、社交關係**。不同人即使選修相同課程，參與理由也可能完全不同。\n\n## 障礙：為什麼無法來學？\n- **情境障礙**：工作、家庭照顧、交通、時間等。\n- **機構障礙**：課程時間、招生流程、費用、場地與支援不足。\n- **意向障礙**：害怕失敗、缺乏信心、覺得學習與自己無關。\n- **訊息障礙**：不知道有哪些課程或如何報名。\n\n## 教學與機構的回應\n1. 課前需求調查，讓課程解決實際問題。\n2. 提供友善、無威脅的學習情境及適性支持。\n3. 透過同儕、社區與多元媒體傳播學習資訊。\n4. 為數位能力較弱者保留面對面協助。\n\n**來源：** 吳明烈《成人學習理論與實務（2026）》，第3–13張；《成人教學的理論與實務2026》，第11–12張；《112年成人教育調查報告2025》，第36、44張。\n", "content": "<h1>成人學習動機與參與障礙<\/h1>\n<h2>動機：為什麼來學？<\/h2>\n<p>教材列出六項動機：<strong>求知興趣、職業進展、逃避或刺激、社會服務、外界期望、社交關係<\/strong>。不同人即使選修相同課程，參與理由也可能完全不同。<\/p>\n<h2>障礙：為什麼無法來學？<\/h2>\n<ul>\n<li><strong>情境障礙<\/strong>：工作、家庭照顧、交通、時間等。<\/li>\n<li><strong>機構障礙<\/strong>：課程時間、招生流程、費用、場地與支援不足。<\/li>\n<li><strong>意向障礙<\/strong>：害怕失敗、缺乏信心、覺得學習與自己無關。<\/li>\n<li><strong>訊息障礙<\/strong>：不知道有哪些課程或如何報名。<\/li>\n<\/ul>\n<h2>教學與機構的回應<\/h2>\n<ol>\n<li>課前需求調查，讓課程解決實際問題。<\/li>\n<li>提供友善、無威脅的學習情境及適性支持。<\/li>\n<li>透過同儕、社區與多元媒體傳播學習資訊。<\/li>\n<li>為數位能力較弱者保留面對面協助。<\/li>\n<\/ol>\n<p><strong>來源：<\/strong> 吳明烈《成人學習理論與實務（2026）》，第3–13張；《成人教學的理論與實務2026》，第11–12張；《112年成人教育調查報告2025》，第36、44張。<\/p>\n", "category": "吳明烈教材專題"}, {"id": "13_成人教學方法與九項策略", "title": "成人教學方法與九項實務策略", "text": "# 成人教學方法與九項實務策略\n\n## 教學方法如何選？\n吳明烈老師強調：**「教學有法，但無定法，貴在得法。」** 教師須同時考量教學目標、內容、對象、團體大小、設備，以及個人專長。\n\n- **較偏教師引導**：講述、示範、經驗傳承。\n- **較偏學員參與**：腦力激盪、討論、角色扮演、研討會、工作坊、實地參訪、契約學習、自我導向學習、世界咖啡館。\n- **可以搭配**：例如先短講，再讓學員討論和操作，最後完成生活應用。\n\n## 九項教學策略\n1. 了解成人學習者生理、心理及社會特性。\n2. 增強學習動機與學習信心。\n3. 安排合宜的物理與心理學習情境。\n4. 編選有效、有意義、有趣且實用的教材。\n5. 建立友善、非威脅性的學習氣氛。\n6. 運用個別化教學精神與適性支持。\n7. 善用成人既有經驗作為學習資源。\n8. 採用生活問題中心的教學架構。\n9. 以多元評量兼顧歷程與成果，重視自我比較。\n\n**實例：** 教長輩辨識詐騙簡訊，先呈現一封常見訊息，讓學員指出可疑處，再示範驗證方式，最後由學員獨立判斷另一個案例。\n\n**來源：** 吳明烈《成人教學的理論與實務2026》，第13–15、20–32張；《成人學習理論與實務（2026）》，第23–36張。\n", "content": "<h1>成人教學方法與九項實務策略<\/h1>\n<h2>教學方法如何選？<\/h2>\n<p>吳明烈老師強調：<strong>「教學有法，但無定法，貴在得法。」<\/strong> 教師須同時考量教學目標、內容、對象、團體大小、設備，以及個人專長。<\/p>\n<ul>\n<li><strong>較偏教師引導<\/strong>：講述、示範、經驗傳承。<\/li>\n<li><strong>較偏學員參與<\/strong>：腦力激盪、討論、角色扮演、研討會、工作坊、實地參訪、契約學習、自我導向學習、世界咖啡館。<\/li>\n<li><strong>可以搭配<\/strong>：例如先短講，再讓學員討論和操作，最後完成生活應用。<\/li>\n<\/ul>\n<h2>九項教學策略<\/h2>\n<ol>\n<li>了解成人學習者生理、心理及社會特性。<\/li>\n<li>增強學習動機與學習信心。<\/li>\n<li>安排合宜的物理與心理學習情境。<\/li>\n<li>編選有效、有意義、有趣且實用的教材。<\/li>\n<li>建立友善、非威脅性的學習氣氛。<\/li>\n<li>運用個別化教學精神與適性支持。<\/li>\n<li>善用成人既有經驗作為學習資源。<\/li>\n<li>採用生活問題中心的教學架構。<\/li>\n<li>以多元評量兼顧歷程與成果，重視自我比較。<\/li>\n<\/ol>\n<p><strong>實例：<\/strong> 教長輩辨識詐騙簡訊，先呈現一封常見訊息，讓學員指出可疑處，再示範驗證方式，最後由學員獨立判斷另一個案例。<\/p>\n<p><strong>來源：<\/strong> 吳明烈《成人教學的理論與實務2026》，第13–15、20–32張；《成人學習理論與實務（2026）》，第23–36張。<\/p>\n", "category": "吳明烈教材專題"}, {"id": "14_成人教師角色與師生關係", "title": "成人教師角色與師生關係", "text": "# 成人教師角色與師生關係\n\n## 教師不是單向傳授者\n教師可以同時是**知識傳遞者、團體領導者、過程管理者、溝通協調者與學習指導者**，也應保有自己作為學習者的態度。\n\n## 教師應有特質\n- 知識與實務兼備。\n- 尊重他人、具備良好人格特質。\n- 能運用創意教學方法與彈性應變。\n\n## 五項友善師生關係\n1. 師生維持平等且互相尊重的關係。\n2. 促進雙向互動而不是只聽教師講述。\n3. 建立學習者彼此接納的氛圍。\n4. 培養友誼與團體歸屬感。\n5. 鼓勵合作，避免不必要的競爭比較。\n\n**教學提醒：** 高齡學員操作手機較慢時，不以速度排序；可給予紙本步驟卡、同儕協助及重新練習的時間。\n\n**來源：** 吳明烈《成人教學的理論與實務2026》，第7–10張；《成人學習理論與實務（2026）》，第14–17張。\n", "content": "<h1>成人教師角色與師生關係<\/h1>\n<h2>教師不是單向傳授者<\/h2>\n<p>教師可以同時是<strong>知識傳遞者、團體領導者、過程管理者、溝通協調者與學習指導者<\/strong>，也應保有自己作為學習者的態度。<\/p>\n<h2>教師應有特質<\/h2>\n<ul>\n<li>知識與實務兼備。<\/li>\n<li>尊重他人、具備良好人格特質。<\/li>\n<li>能運用創意教學方法與彈性應變。<\/li>\n<\/ul>\n<h2>五項友善師生關係<\/h2>\n<ol>\n<li>師生維持平等且互相尊重的關係。<\/li>\n<li>促進雙向互動而不是只聽教師講述。<\/li>\n<li>建立學習者彼此接納的氛圍。<\/li>\n<li>培養友誼與團體歸屬感。<\/li>\n<li>鼓勵合作，避免不必要的競爭比較。<\/li>\n<\/ol>\n<p><strong>教學提醒：<\/strong> 高齡學員操作手機較慢時，不以速度排序；可給予紙本步驟卡、同儕協助及重新練習的時間。<\/p>\n<p><strong>來源：<\/strong> 吳明烈《成人教學的理論與實務2026》，第7–10張；《成人學習理論與實務（2026）》，第14–17張。<\/p>\n", "category": "吳明烈教材專題"}, {"id": "15_世界咖啡館教學法", "title": "世界咖啡館（World Café）教學法", "text": "# 世界咖啡館（World Café）教學法\n\n世界咖啡館是一種以**重要問題、輪桌對話、共同收斂**為核心的團體對話方式，適合經驗豐富、觀點多元的成人學習者。\n\n## 基本流程\n1. 設定清楚而開放的議題，例如：「社區如何讓更多長輩願意上課？」\n2. 以4–5人一桌進行小組對話。\n3. 指定桌長；其他成員輪桌交換看法。\n4. 每輪記錄重要觀點、案例與疑問。\n5. 最後由全班共同整理共識、分歧與可能行動。\n\n## 教師的角色\n- 設計能引發思考的問題。\n- 建立安全、尊重、多元的對話空間。\n- 幫助沉默者有機會發言，並鼓勵傾聽。\n- 引導將討論成果轉化為下一步行動。\n\n## 使用界線\n老師的簡報描述較完整的世界咖啡館通常需多輪討論與足夠時間；若只有10分鐘，可改採「世界咖啡館精神的短版討論」，不宜宣稱為完整流程。\n\n**來源：** 吳明烈《成人學習理論與實務（2026）》，第41–60張。\n", "content": "<h1>世界咖啡館（World Café）教學法<\/h1>\n<p>世界咖啡館是一種以<strong>重要問題、輪桌對話、共同收斂<\/strong>為核心的團體對話方式，適合經驗豐富、觀點多元的成人學習者。<\/p>\n<h2>基本流程<\/h2>\n<ol>\n<li>設定清楚而開放的議題，例如：「社區如何讓更多長輩願意上課？」<\/li>\n<li>以4–5人一桌進行小組對話。<\/li>\n<li>指定桌長；其他成員輪桌交換看法。<\/li>\n<li>每輪記錄重要觀點、案例與疑問。<\/li>\n<li>最後由全班共同整理共識、分歧與可能行動。<\/li>\n<\/ol>\n<h2>教師的角色<\/h2>\n<ul>\n<li>設計能引發思考的問題。<\/li>\n<li>建立安全、尊重、多元的對話空間。<\/li>\n<li>幫助沉默者有機會發言，並鼓勵傾聽。<\/li>\n<li>引導將討論成果轉化為下一步行動。<\/li>\n<\/ul>\n<h2>使用界線<\/h2>\n<p>老師的簡報描述較完整的世界咖啡館通常需多輪討論與足夠時間；若只有10分鐘，可改採「世界咖啡館精神的短版討論」，不宜宣稱為完整流程。<\/p>\n<p><strong>來源：<\/strong> 吳明烈《成人學習理論與實務（2026）》，第41–60張。<\/p>\n", "category": "吳明烈教材專題"}, {"id": "16_成人教育的社會功能", "title": "成人教育的社會功能與終身學習價值", "text": "# 成人教育的社會功能與終身學習價值\n\n吳明烈老師《成人教育學的發展源起與理論》從社會學視角整理成人教育的八種功能：\n\n1. 社會化與社會參與。\n2. 提升工作技能、經濟發展與人力資源。\n3. 促進社會流動。\n4. 提供第二次教育機會。\n5. 協助合理安排休閒時間與生活。\n6. 促進個人持續發展與自主。\n7. 傳遞文化、維持社會連結。\n8. 激發社會行動與變遷。\n\n## 實務例子\n- 新住民生活課：協助語言與公共資訊適應。\n- 社區大學地方走讀：在知識學習之外連結文化保存及公共參與。\n- 樂齡課程：促進退休後生活適應與社會交流。\n\n## 流質與晶質智力\n教材指出流質智力及晶質智力隨年齡的變化路徑可能不同。**教學設計不能以年齡一概推斷個別學員能力**；應兼顧速度、經驗與實際表現。\n\n**來源：** 吳明烈《成人教育學的發展源起與理論2026》，第8–29張。\n", "content": "<h1>成人教育的社會功能與終身學習價值<\/h1>\n<p>吳明烈老師《成人教育學的發展源起與理論》從社會學視角整理成人教育的八種功能：<\/p>\n<ol>\n<li>社會化與社會參與。<\/li>\n<li>提升工作技能、經濟發展與人力資源。<\/li>\n<li>促進社會流動。<\/li>\n<li>提供第二次教育機會。<\/li>\n<li>協助合理安排休閒時間與生活。<\/li>\n<li>促進個人持續發展與自主。<\/li>\n<li>傳遞文化、維持社會連結。<\/li>\n<li>激發社會行動與變遷。<\/li>\n<\/ol>\n<h2>實務例子<\/h2>\n<ul>\n<li>新住民生活課：協助語言與公共資訊適應。<\/li>\n<li>社區大學地方走讀：在知識學習之外連結文化保存及公共參與。<\/li>\n<li>樂齡課程：促進退休後生活適應與社會交流。<\/li>\n<\/ul>\n<h2>流質與晶質智力<\/h2>\n<p>教材指出流質智力及晶質智力隨年齡的變化路徑可能不同。<strong>教學設計不能以年齡一概推斷個別學員能力<\/strong>；應兼顧速度、經驗與實際表現。<\/p>\n<p><strong>來源：<\/strong> 吳明烈《成人教育學的發展源起與理論2026》，第8–29張。<\/p>\n", "category": "吳明烈教材專題"}, {"id": "17_歐美成人教育組織與國際趨勢", "title": "歐美成人教育組織與國際終身學習趨勢", "text": "# 歐美成人教育組織與國際終身學習趨勢\n\n## 主要組織\n- **EAEA（歐洲成人教育學會）**：連結歐洲成人學習與相關倡議。\n- **Learning and Work Institute（英國）**：研究學習、技能、就業與社會參與。\n- **DIE（德國成人教育研究機構）**：成人與繼續教育專業研究。\n- **AAACE（美國成人及繼續教育學會）**：促進成人教育研究、專業交流與實務。\n\n## 教材整理的國際發展方向\n學習型城市、高齡教育與活躍老化、職場學習、成人關鍵能力、學習成果認可、成人學習週、弱勢族群參與，以及終身學習品質。\n\n## 對教學者的啟示\n成人教學是終身學習網絡的一部分。課程規劃除了考量課堂方法，也要思考資源如何讓學員進得來、學得會、用得上。\n\n**來源：** 吳明烈《歐美成人教育機構組織與資源2026》，第3–21張。以上為教材中的組織與方向，不等於已即時查證所有現行政策與組織資料。\n", "content": "<h1>歐美成人教育組織與國際終身學習趨勢<\/h1>\n<h2>主要組織<\/h2>\n<ul>\n<li><strong>EAEA（歐洲成人教育學會）<\/strong>：連結歐洲成人學習與相關倡議。<\/li>\n<li><strong>Learning and Work Institute（英國）<\/strong>：研究學習、技能、就業與社會參與。<\/li>\n<li><strong>DIE（德國成人教育研究機構）<\/strong>：成人與繼續教育專業研究。<\/li>\n<li><strong>AAACE（美國成人及繼續教育學會）<\/strong>：促進成人教育研究、專業交流與實務。<\/li>\n<\/ul>\n<h2>教材整理的國際發展方向<\/h2>\n<p>學習型城市、高齡教育與活躍老化、職場學習、成人關鍵能力、學習成果認可、成人學習週、弱勢族群參與，以及終身學習品質。<\/p>\n<h2>對教學者的啟示<\/h2>\n<p>成人教學是終身學習網絡的一部分。課程規劃除了考量課堂方法，也要思考資源如何讓學員進得來、學得會、用得上。<\/p>\n<p><strong>來源：<\/strong> 吳明烈《歐美成人教育機構組織與資源2026》，第3–21張。以上為教材中的組織與方向，不等於已即時查證所有現行政策與組織資料。<\/p>\n", "category": "吳明烈教材專題"}, {"id": "18_社區大學的角色與永續經營", "title": "社區大學的角色與永續發展", "text": "# 社區大學的角色與永續發展\n\n## 三種角色定位\n1. **非正規教育機構**：提供有組織的多元學習。\n2. **終身學習機構**：支持成人持續學習與自我發展。\n3. **社區發展促進者**：連結地方議題、公民參與及社會行動。\n\n## 國際比較\n教材對比丹麥民眾高等學校、德國民眾高等學校與美國社區學院。臺灣社區大學在教學定位及運作型態上，有許多接近歐洲社區成人教育機構的面向；不宜因名稱相似便視為美國社區學院的同一制度。\n\n## 永續發展重點\n- 願景與在地特色。\n- 組織經營模式與公共資源。\n- 財務支持與公平參與。\n- 策略聯盟及跨單位合作。\n- 師資、行政及志工專業化。\n- 品質評鑑、回饋與持續改進。\n\n## 教學實例\n以「地方水圳與環境」為主題，結合社區走讀、居民訪談、議題討論與成果展，將知識轉化為社區參與。\n\n**來源：** 吳明烈《社區大學的永續發展策略》，第2–9、18–23、24–41張。教材中的法制與機構數字有其原始製作時點，不直接視為2026年現況。\n", "content": "<h1>社區大學的角色與永續發展<\/h1>\n<h2>三種角色定位<\/h2>\n<ol>\n<li><strong>非正規教育機構<\/strong>：提供有組織的多元學習。<\/li>\n<li><strong>終身學習機構<\/strong>：支持成人持續學習與自我發展。<\/li>\n<li><strong>社區發展促進者<\/strong>：連結地方議題、公民參與及社會行動。<\/li>\n<\/ol>\n<h2>國際比較<\/h2>\n<p>教材對比丹麥民眾高等學校、德國民眾高等學校與美國社區學院。臺灣社區大學在教學定位及運作型態上，有許多接近歐洲社區成人教育機構的面向；不宜因名稱相似便視為美國社區學院的同一制度。<\/p>\n<h2>永續發展重點<\/h2>\n<ul>\n<li>願景與在地特色。<\/li>\n<li>組織經營模式與公共資源。<\/li>\n<li>財務支持與公平參與。<\/li>\n<li>策略聯盟及跨單位合作。<\/li>\n<li>師資、行政及志工專業化。<\/li>\n<li>品質評鑑、回饋與持續改進。<\/li>\n<\/ul>\n<h2>教學實例<\/h2>\n<p>以「地方水圳與環境」為主題，結合社區走讀、居民訪談、議題討論與成果展，將知識轉化為社區參與。<\/p>\n<p><strong>來源：<\/strong> 吳明烈《社區大學的永續發展策略》，第2–9、18–23、24–41張。教材中的法制與機構數字有其原始製作時點，不直接視為2026年現況。<\/p>\n", "category": "吳明烈教材專題"}, {"id": "19_成人教育調查與資料解讀", "title": "成人教育調查與臺灣學習現況", "text": "# 成人教育調查與臺灣學習現況\n\n## 三個經常使用的指標\n- **42.82%**：教材列出的成人正規與非正規學習參與比例。\n- **24.06%**：歷年比較表中65–80歲成人參與比例。\n- **71.53%**：透過數位科技或網路進行非正式學習的受訪比例。\n\n這三個數字的**問項、母群與學習類型並不相同**，不適合直接互相比較，更不能把「使用網路學習」解讀成「完成線上課程」。\n\n## 調查提供的教學啟示\n1. 不同背景的成人有不同的學習參與情形，規劃課程應做需求調查。\n2. 參與障礙不只來自個人意願，還可能是生活情境、資訊取得與機構條件。\n3. 數位學習可以拓展機會，但應保留弱勢與數位初學者的支持機制。\n4. 成效評估不能只看滿意度，還需評量理解、技能與生活應用。\n\n## 統計資料使用注意\n《112年度成人教育調查報告2025》中的部分頁面標註「2024年調查」及不同統計年份；正式引用時應保留表格原始統計期間，不可一概寫為最新年度。\n\n**來源：** 吳明烈等《112年成人教育調查報告2025》，第11、20–22、36、42–44、49張；使用者《成人教學理論與實務－1201報告》，第30頁。\n", "content": "<h1>成人教育調查與臺灣學習現況<\/h1>\n<h2>三個經常使用的指標<\/h2>\n<ul>\n<li><strong>42.82%<\/strong>：教材列出的成人正規與非正規學習參與比例。<\/li>\n<li><strong>24.06%<\/strong>：歷年比較表中65–80歲成人參與比例。<\/li>\n<li><strong>71.53%<\/strong>：透過數位科技或網路進行非正式學習的受訪比例。<\/li>\n<\/ul>\n<p>這三個數字的<strong>問項、母群與學習類型並不相同<\/strong>，不適合直接互相比較，更不能把「使用網路學習」解讀成「完成線上課程」。<\/p>\n<h2>調查提供的教學啟示<\/h2>\n<ol>\n<li>不同背景的成人有不同的學習參與情形，規劃課程應做需求調查。<\/li>\n<li>參與障礙不只來自個人意願，還可能是生活情境、資訊取得與機構條件。<\/li>\n<li>數位學習可以拓展機會，但應保留弱勢與數位初學者的支持機制。<\/li>\n<li>成效評估不能只看滿意度，還需評量理解、技能與生活應用。<\/li>\n<\/ol>\n<h2>統計資料使用注意<\/h2>\n<p>《112年度成人教育調查報告2025》中的部分頁面標註「2024年調查」及不同統計年份；正式引用時應保留表格原始統計期間，不可一概寫為最新年度。<\/p>\n<p><strong>來源：<\/strong> 吳明烈等《112年成人教育調查報告2025》，第11、20–22、36、42–44、49張；使用者《成人教學理論與實務－1201報告》，第30頁。<\/p>\n", "category": "吳明烈教材專題"}, {"id": "20_理論與實務跨教材對照", "title": "理論到實務：跨教材的教學設計對照", "text": "# 理論到實務：跨教材的教學設計對照\n\n| 教學目標 | 理論／教材重點 | 可採用的教學方式 | 學習證據 |\n|---|---|---|---|\n| 建立學習動機 | 看見需求、點燃熱情；成人知道為何學 | 真實生活案例、簡短提問 | 學員能說出學習用途 |\n| 理解新知識 | 認知負荷、分段教學與鷹架 | 以短步驟示範、移除干擾 | 能口述或指出關鍵步驟 |\n| 交流既有經驗 | 分享式教學、成人經驗資源 | 故事分享、分組討論 | 能比較新舊經驗 |\n| 實作與合作 | 建構主義、體驗式學習 | 角色扮演、工作坊 | 能完成學習任務 |\n| 增進信心 | 人本、平等師生關係 | 低壓支持、個人化回饋 | 願意再次嘗試 |\n| 帶回生活 | 問題中心及多元評量 | 應用任務、課後分享 | 能舉生活應用案例 |\n\n## 微型教案：樂齡大腦健身房\n- 1個主題：手腦並用，越玩越靈活。\n- 2個活動：先「大腦健康知多少」再「手腦協調動一動」。\n- 3個應用：自創手指操、與朋友分享、散步伸展。\n\n這套 **1・2・3 是本次教案整理格式**，不是已被驗證的獨立教育理論。\n\n**來源：** 吳明烈《成人學習理論與實務（2026）》，第3、7、23–36張；《成人教學的理論與實務2026》，第2–3、20–32張；使用者《成人教學理論與實務－1201報告》，第31–34頁。\n", "content": "<h1>理論到實務：跨教材的教學設計對照<\/h1>\n<table>\n<thead>\n<tr>\n  <th>教學目標<\/th>\n  <th>理論／教材重點<\/th>\n  <th>可採用的教學方式<\/th>\n  <th>學習證據<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>建立學習動機<\/td>\n  <td>看見需求、點燃熱情；成人知道為何學<\/td>\n  <td>真實生活案例、簡短提問<\/td>\n  <td>學員能說出學習用途<\/td>\n<\/tr>\n<tr>\n  <td>理解新知識<\/td>\n  <td>認知負荷、分段教學與鷹架<\/td>\n  <td>以短步驟示範、移除干擾<\/td>\n  <td>能口述或指出關鍵步驟<\/td>\n<\/tr>\n<tr>\n  <td>交流既有經驗<\/td>\n  <td>分享式教學、成人經驗資源<\/td>\n  <td>故事分享、分組討論<\/td>\n  <td>能比較新舊經驗<\/td>\n<\/tr>\n<tr>\n  <td>實作與合作<\/td>\n  <td>建構主義、體驗式學習<\/td>\n  <td>角色扮演、工作坊<\/td>\n  <td>能完成學習任務<\/td>\n<\/tr>\n<tr>\n  <td>增進信心<\/td>\n  <td>人本、平等師生關係<\/td>\n  <td>低壓支持、個人化回饋<\/td>\n  <td>願意再次嘗試<\/td>\n<\/tr>\n<tr>\n  <td>帶回生活<\/td>\n  <td>問題中心及多元評量<\/td>\n  <td>應用任務、課後分享<\/td>\n  <td>能舉生活應用案例<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>微型教案：樂齡大腦健身房<\/h2>\n<ul>\n<li>1個主題：手腦並用，越玩越靈活。<\/li>\n<li>2個活動：先「大腦健康知多少」再「手腦協調動一動」。<\/li>\n<li>3個應用：自創手指操、與朋友分享、散步伸展。<\/li>\n<\/ul>\n<p>這套 <strong>1・2・3 是本次教案整理格式<\/strong>，不是已被驗證的獨立教育理論。<\/p>\n<p><strong>來源：<\/strong> 吳明烈《成人學習理論與實務（2026）》，第3、7、23–36張；《成人教學的理論與實務2026》，第2–3、20–32張；使用者《成人教學理論與實務－1201報告》，第31–34頁。<\/p>\n", "category": "吳明烈教材專題"}];
const sources=[{"title": "吳明烈｜成人教學的理論與實務（2026）", "filename": "成人教學的理論與實務 2026.ppt", "slideCount": 42, "slides": [{"number": 1, "text": "成人教學的理論與實務 吳明烈特聘教授 國立暨南國際大學 終身學習與人力資源發展學系"}, {"number": 2, "text": "成人教學是一種分享式教學"}, {"number": 3, "text": "分享是生活與學習的方式"}, {"number": 4, "text": "分享讓我們相聚在一起"}, {"number": 5, "text": "分 享"}, {"number": 6, "text": "成人學習的六項重要概念(M. S. Knowles) 成人擁有認知需求，想要知道為何學習 成人具有清楚的自我概念以及 自我導向學習的能力 成人具有豐富的學習經驗， 經驗成為學習的重要資源 成人的學習準備度與其社會角色的 發展任務有關 成人學習傾向生活中心與問題導向 成人學習動機主要來自內在誘因， 而非外在誘因"}, {"number": 7, "text": "成人教師的角色 在成人教學的過程中，師生係一種平等的關係而非上下的關係。教師同時兼具學習者、朋友與協助者等角色：  知識傳遞者  團體領導者  過程管理者  溝通協調者  學習指導者"}, {"number": 8, "text": "成人教師應有的特質  知識與實務兼備  優良的人格特質  要有創意的教學法"}, {"number": 9, "text": "成人教學中的師生關係模式 （E. Lenz） 主客模式 案主與諮商者模式 合夥者模式"}, {"number": 10, "text": "成人教學中師生關係的建立 師生處於平等的地位 促進成人師生間互動的學習過程 建立學習者彼此接受的學習氣氛 培養友誼氣氛，使團體產生融洽的氣氛 造成班級是一個合作的團體，而非競爭的團體"}, {"number": 11, "text": "成人的學習特性 學習活動的明確結果 問題中心的學習架構 內在化的學習動機 經驗是學習的助力也是學習的阻力 主動參與學習"}, {"number": 12, "text": "成人學習的參與障礙 情境障礙 機構障礙 意向障礙"}, {"number": 13, "text": "以教師為中心的教學法 示範 講述法 經驗傳承法"}, {"number": 14, "text": "以學生為中心的教學法 腦力激盪法 團體討論法 角色扮演 研討會"}, {"number": 15, "text": "以學生為中心的教學法（續） 工作坊 實地參觀 契約學習法(contract learning) 自我導向學習法(self-directed learning) 創意教學法 世界咖啡館(World Café)"}, {"number": 16, "text": "德國新天鵝堡 到新天鵝堡的方法"}, {"number": 17, "text": "可以搭馬車"}, {"number": 18, "text": "可以步行"}, {"number": 19, "text": "可以搭小巴士"}, {"number": 20, "text": "教學有法 但無定法 貴在得法"}, {"number": 21, "text": "選擇適當的成人教學方法 教學目標 教學內容 教學對象 團體大小 場地設備 教師的人格特質與專長"}, {"number": 22, "text": "成人教學的模式 建立一種有益學習的氣氛 創造一種共同參與教學計畫的機制 診斷學習需求 形成方案目標 設計一種學習經驗的模式 以適當的技術與教材指導學習活動的進行 評量學習成果"}, {"number": 23, "text": "成人教學的策略之一： 瞭解成人學習者的特性 生理層面：感官能力消退與反應速度減慢 心理層面：流質智力逐漸衰退而晶質智力持續增長；記憶力的衰退 社會層面：扮演多重角色以及對時間的觀點"}, {"number": 24, "text": "成人教學的策略之二： 增強成人的學習動機 學習目標與學習者能力相配合 提供增強與回饋 使學習者多參與學習活動 建立積極的學習環境 使學習者獲致成就感 建立合作而非競爭的教室氣氛"}, {"number": 25, "text": "成人教學的策略之三： 安排適當的成人學習情境 物理環境  設備的安置  座位的安排  環境的美感"}, {"number": 26, "text": "成人教學的策略之三： 安排適當的成人學習情境（續） 心理環境 相互尊重的氣氛 合作的氣氛 相互信賴的氣氛 支持的氣氛 開放、真實的氣氛 愉快的氣氛 人性化的氣氛"}, {"number": 27, "text": "成人教學的策略之四： 編選適當的成人教育教材 有效性(validity) 有意義(significance) 興趣(interest) 可學習性(learn ability) 社會現實一致性(consistency with social realitites) 實用性(utility)"}, {"number": 28, "text": "成人教學的策略之五： 建立非正式學習的氣氛 成人學習者的特性之一，自尊心強但自信心欠缺 早年不愉快的學習經驗往往影響再學習的信心 學習的基本技能或已被遺忘"}, {"number": 29, "text": "成人教學的策略之六： 運用個別化教學的精神與方法 成人學習團體異質性大，在教學中應隨時注意個別化教學方法與精神的運用"}, {"number": 30, "text": "成人教學的策略之七： 促使成人的經驗成為學習的重要資源 新教材的學習與成人的經驗相契合 多採用利用成人經驗的教學法 調整不適宜的先入為主舊經驗"}, {"number": 31, "text": "成人教學的策略之八： 採用問題中心的學習架構 成人希望藉由學習活動的參與來解決問題 採取問題中心的架構，契合成人的學習經驗 教學以問題為中心，並與生活相結合，進而激發成人學習的興趣"}, {"number": 32, "text": "成人教學的策略之九： 採用適合成人學習的評量方法 根據教學目標進行評量 運用應多樣化的評量方法 考慮成人的學習特性 兼重學習的過程與結果 評量結果的解釋應強調自我比較而避免相互比較 不要過於強調分數與等級 提供學習者參與評量的機會 促使成人學習者從評量獲得成就感"}, {"number": 33, "text": "有效成人教學的533533 成人教師的必要五訣 追求人生的三度 教學的三個原則與串連 身懷絕技的五隻手 擁有學習的三千萬 擁抱生活中的三意"}, {"number": 34, "text": "成人教學經驗分享： 創新、多元、愉悅、效益 建置教師個人網頁http://adumlw.ccu.edu.tw 網路討論區之心得交流與分享 讀書會或學習社群的運作 分組活動 戶外教學（處處即教室） 影片教學、數位影音教材（電視與廣播節目） 學習夥伴 專題演講 傾聽學習者的心聲 體驗學習 世界咖啡館(World Café)"}, {"number": 35, "text": "康河上的那一片雲彩"}, {"number": 36, "text": "善用教學的正確切入點與著力點"}, {"number": 37, "text": "欸乃一聲過小橋"}, {"number": 38, "text": "阿爾卑斯山的感動"}, {"number": 39, "text": "這條路，你要好好走 這輩子可能就只有這麼一次"}, {"number": 40, "text": "珍惜生命中的每一次"}, {"number": 41, "text": "成人教學的分享與迴響 ～教學․創新․感動․分享～"}, {"number": 42, "text": "Thank you! Danke schön To have known the best, and to have known it for the best, is success in life ～John Mackay 知道最好的一切，且將之發揮至極致，才是成功的生活"}]}, {"title": "吳明烈｜成人學習理論與實務（2026）", "filename": "成人學習理論與實務（2026）.ppt", "slideCount": 65, "slides": [{"number": 1, "text": "成人學習理論與實務 吳明烈 國立暨南國際大學 諮商心理與人力資源發展學系特聘教授 中華民國組織學習協會理事長 "}, {"number": 2, "text": "Learning is earning learning lifelong learning earning lifelong earning"}, {"number": 3, "text": "有效成人學習的三部曲 看見需求 點燃熱情 創造價值"}, {"number": 4, "text": "flow experience 心 流 經 驗 要 他 學 他 要 學 他 樂 學"}, {"number": 5, "text": "你的學習有flow 嗎 flow experience :心流經驗、神馳狀態"}, {"number": 6, "text": "成人學習的533533 成人學習的成功五訣 追求人生的三度 學習的三個原則與串連 身懷絕技的五隻手 擁有學習的三千萬 擁抱生活中的三意"}, {"number": 7, "text": "成人學習的六項重要概念(M. S. Knowles) 成人擁有認知需求，想要知道為何學習 成人具有清楚的自我概念以及自我導向學習能力 成人具有豐富的學習經驗，經驗成為學習的重要資源 成人的學習準備度與其社會角色的發展任務有關 成人學習傾向生活中心與問題導向 成人學習動機主要來自內在誘因，而非外在誘因"}, {"number": 8, "text": "成人的心理特性 成熟概念 分歧與多樣化的概念 角色的問題：多重、持續改變、角色衝突 時間知覺 變異性"}, {"number": 9, "text": "成人參與學習障礙的類型 情境的障礙 機構的障礙 意向的障礙 訊息的障礙"}, {"number": 10, "text": "促進成人的學習參與 對成人學習者方面 建立終身學習的正確觀念 建立學習者的自信心 教學設計方面 提供較不具威脅性的學習型態，建立學習者信心 提供適當的輔導，加強成人的自尊心與自重感"}, {"number": 11, "text": "促進成人的學習參與（續） 課程規劃方面 規劃課程時應實地調查成年人的學習需求 強調問題取向的成人教育課程 行銷宣傳方面 藉由成年人的人際脈絡進行宣傳 運用多元管道傳布學習訊息 品牌經營與顧客之間口耳相傳"}, {"number": 12, "text": "促進成人的學習參與（續） 機構服務方面 專業化的師資、行政團隊 協助排除學習障礙，提供學習機會 建立教育機構的服務網絡，提供多元學習管道 感動服務"}, {"number": 13, "text": "成人學習動機的六項因素 求知興趣﹙cognitive interest﹚ 職業進展﹙professional advancement﹚ 逃避或刺激﹙escape/stimulation﹚ 社會服務﹙social welfare﹚ 外界期望﹙external expectation﹚ 社交關係﹙social relation﹚"}, {"number": 14, "text": "成人教師的角色 在成人教學的過程中，師生係一種平等的關係而非上下的關係。教師同時兼具學習者、朋友與協助者等角色：  知識傳遞者  團體領導者  過程管理者  溝通協調者  學習指導者"}, {"number": 15, "text": "成人教師應有的特質  知識與實務兼備  優良的人格特質  要有創意的教學法"}, {"number": 16, "text": "成人教學中的師生關係模式 （E. Lenz） 主客模式 案主與諮商者模式 合夥者模式"}, {"number": 17, "text": "成人教學中師生關係的建立 師生處於平等的地位 促進成人師生間互動的學習過程 建立學習者彼此接受的學習氣氛 培養友誼氣氛，使團體產生融洽的氣氛 造成班級是一個合作團體，而非競爭團體"}, {"number": 18, "text": "成人教學方法舉隅 工作坊 說故事 契約學習法(contract learning) 自我導向學習法(self-directed learning) 創意教學法 線上教學 體驗學習 世界咖啡館(World Café) ……"}, {"number": 19, "text": "德國新天鵝堡 到新天鵝堡的方法"}, {"number": 20, "text": "可以搭馬車"}, {"number": 21, "text": "可以步行"}, {"number": 22, "text": "可以搭小巴士"}, {"number": 23, "text": "教學有法 但無定法 貴在得法"}, {"number": 24, "text": "選擇適當的成人教學方法 教學目標 教學內容 教學對象 團體大小 場地設備 教師的人格特質與專長"}, {"number": 25, "text": "成人教學的模式 建立一種有益學習的氣氛 創造一種共同參與教學計畫的機制 診斷學習需求 形成方案目標 設計一種學習經驗的模式 以適當的技術與教材指導學習活動的進行 評量學習成果"}, {"number": 26, "text": "有效之成人學習促進策略"}, {"number": 27, "text": "一、瞭解成人學習者的特性 生理層面：感官能力消退與反應速度減慢 心理層面：流質智力逐漸衰退而晶質智力持續增長；記憶力的衰退 社會層面：扮演多重角色以及對時間的觀點"}, {"number": 28, "text": "二、增強成人的學習動機 學習目標與學習者能力相配合 提供增強與回饋 使學習者多參與學習活動 建立積極的學習環境 使學習者獲致成就感 建立合作而非競爭的教室氣氛"}, {"number": 29, "text": "三、安排適當的成人學習情境 物理環境  設備的安置  座位的安排  環境的美感"}, {"number": 30, "text": "成人教學的策略之三： 安排適當的成人學習情境（續） 心理環境 相互尊重的氣氛 合作的氣氛 相互信賴的氣氛 支持的氣氛 開放、真實的氣氛 愉快的氣氛 人性化的氣氛"}, {"number": 31, "text": "四、編選適當的成人教育教材 有效性 有意義 興趣 可學習性 社會現實一致性 實用性"}, {"number": 32, "text": "五、建立非正式學習的氣氛 成人學習者的特性之一，自尊心強但自信心欠缺 早年不愉快的學習經驗往往影響再學習的信心 學習的基本技能或已被遺忘"}, {"number": 33, "text": "六、運用個別化教學的精神與方法 成人學習團體異質性大，在教學中應隨時注意個別化教學方法與精神的運用"}, {"number": 34, "text": "七、促使成人經驗成為學習的重要資源 新教材的學習與成人的經驗相契合 多採用利用成人經驗的教學法 調整不適宜的先入為主舊經驗"}, {"number": 35, "text": "八、採用問題中心的學習架構 成人希望藉由學習活動的參與來解決問題 採取問題中心的架構，契合成人的學習經驗 教學以問題為中心，並與生活相結合，進而激發成人學習的興趣"}, {"number": 36, "text": "九、採用適合成人學習的評量方法 根據教學目標進行評量 運用應多樣化的評量方法 考慮成人的學習特性 兼重學習的過程與結果 評量結果的解釋應強調自我比較而避免相互比較 不要過於強調分數與等級 提供學習者參與評量的機會 促使成人學習者從評量獲得成就感"}, {"number": 37, "text": "邁向五共的成人學習 共學 共享 共樂 共好 共憶"}, {"number": 38, "text": "成人教學經驗分享： 創新、多元、愉悅、效益 建置教師個人網頁"}, {"number": 39, "text": "終身學習嘉言錄～ 吳明烈 學習是持續開悟、領悟與體悟的過程。 終身學習是一連串的探索與驚奇之旅。 工作學習化，學習工作化。生活學習化，學習生活化。 人的觀點，來自於現在站在那一點，也決定未來會站在那一點。 生命中所有的遇見都是最好的遇見；所有的發生都是最好的發生。關鍵在於能夠從所有遇見與發生中，找到意義並獲得啟發。 學習型組織的發展，猶如凡鐵鑄成寶劍的過程，即使寶劍尚未鑄成，但也已非當時的那塊凡鐵，一切的努力已有了改變。"}, {"number": 40, "text": "社區大學優質課程案例分享 http://rdccl.nccu.edu.tw/mv/news.php?class=301 天文觀測－星空之美（士林社大） 當黑貓遇見紫牛【創意農產經營與品牌行銷】（二林社大） 生命故事劇場─生命的聽、說、讀、演（台南社大） 看電影、聊是非、說故事影像閱讀會（羅東社大） 人類學的田野調查（板橋社大） 多樣性台灣.綠色行腳（新莊社大）"}, {"number": 41, "text": "世界咖啡館的運用"}, {"number": 42, "text": "世界咖啡館World Café"}, {"number": 43, "text": "原來咖啡是這樣喝的!! 喝咖啡，聊是不聊非，讓夢想起飛…"}, {"number": 44, "text": "World Café 發起人 ◎華妮塔．布朗博士(Juanita Brown, Ph.D.) 思想夥伴和設計顧問 曾創造和主持各種別出心裁的策略性匯談，探討重要的組織及社會議題。 ◎大衛．伊薩克(David Isaacs) 是Clearing Communication公司的總裁，這是一家以組織和溝通策略見長的公司，合作對象遍及美國境內及國外的資深主管。"}, {"number": 45, "text": "何 謂 世 界 咖 啡 館 ? 一套很有彈性的實用流程，可以帶動同步對話、分享共同找到新的行動契機，並且創造出動態的對話網絡，在重要議題上為組織或社群催生集體智慧 世界咖啡館的別出心裁設計，可以使各團體（數以百人計的團體）在大型座談的架構下，以四到五人為一組的方式展開輪番對話。當這些人在各組之間移動位置、交換構想，用新的角度去審視攸關自己人生、工作或社群的問題時，各組之間的小型對話也開始出現串聯、共構的現象。隨著人際網絡的不斷連結，知識分享的機會也跟著大增。有志一同的感覺越來越強烈，集合眾人的智慧不再是件難事，各種可能的創新之舉於焉浮現"}, {"number": 46, "text": "對於探索發現… 傳 統 觀 念 先坐而言 再起而行 新 興 觀 念 反思與探索 意見回饋與評估 探索成果的收成 行動規劃 執行 集體見地 對話作為核心流程"}, {"number": 47, "text": "<number> 發現新的意義 邁向美好的未來 創意的源頭"}, {"number": 48, "text": "<number> 真正重要的問題會刺激與帶動學習型對話，這些對話會鞏固人際關係的網路及社群，組織再透過社群去孕育出甜美的果實"}, {"number": 49, "text": "World Café的運作 四至五人一桌圍坐 同桌夥伴自我介紹認識 一個人為這桌的主持人(Table Host)。 其他人為 “ambassadors of meaning” 每回合約有20分鐘的對話。 真誠傾聽，關心、尊重他人的談話。 每個人把重要觀念寫下或畫下來。 時間到時，除了各桌主持人外其他人換桌。 加入新的桌次，開始先前的程序。 時間到時， 再換下一桌並重覆先前程序。 通常連續進行數回合的對話，才是全體大匯談。"}, {"number": 50, "text": "桌長的角色 對話、分享、傾聽是World Café的精神 ◎ 身兼參與討論者與服務員的角色 ◎ 換桌時仍留在原桌 ◎ 和新入座的同桌成員分享上回合 對話的精華 ◎ 提醒同桌的人將自己的思維和見 地以書寫、畫圖或塗鴉的方式在 桌上紀錄 ◎ 配合主持人維持會場秩序與時間 掌控"}, {"number": 51, "text": "<number> 相信這是個開放空間，勇敢貢獻自己的想 法 欣賞、聆聽及觀察他人的想法 放下批評，學習反思，有更多想法的連結 讓想法寫入海報紙中 -學習可以增加知識 對話可以啟發智慧- 與會者的角色"}, {"number": 52, "text": "World Café 運作原理 ◎為背景定調 -- what 、why 、how 釐清目的：想清楚找大家集會的目的何在 決定合適的與會者：多元化的思想比較能催生更多的見地與心得發現 利用各種外在因素發揮創意，以達到目的 (時間、預算、場地等)"}, {"number": 53, "text": "World Café 運作原理 ◎營造出宜人好客的環境空間-- Warm 、 Safe 、 Free 會場布置 讓成員自覺是大團體的一部分 以背景音樂陪襯 鼓勵大家散發熱情，建立友善的氣氛…"}, {"number": 54, "text": "World Café 運作原理 ◎探索真正重要的提問 真正的提問是很歡迎各種創見的，能激發創新的思維和實際行動；要架構出可喚起我們內在智慧的策略性問題，因此： 問題簡單明瞭 問題能引人入勝 問題能釋放能量 問題能集中探詢的焦點 問題能讓我們嗅出其中的基本前提 問題能開啟新的未來的種種可能"}, {"number": 55, "text": "World Café 運作原理 ◎鼓勵大家踴躍貢獻己見 尊重和鼓勵每個人的獨特貢獻 強調貢獻除了可以促進知識的創造外，也可以培養社群 可在桌上置放一個「說話物件」(talking object)，手握談話物件的人可以充分清楚的說明自己的想法；沒拿到談話物件的人必須仔細聆聽別人的談話，尊重別人的觀點。"}, {"number": 56, "text": "World Café 運作原理 ◎交流與連結不同的觀點 從對話中不同背景的人開始懂得尊重彼此，也開始懂得體諒別人為何意見與自己相左 促發多元化觀點 實踐合作思考"}, {"number": 57, "text": "<number> 對話網絡的運作"}, {"number": 58, "text": "World Café 運作原理 ◎ 共同聆聽其中的模式、觀點及更深層的問題 善用視覺語言、視覺傾聽進行溝通 透過另一種方式傾聽 — 反思 注意傾聽，串聯和構築出共通想法 當人們鼓勵彼此作更深入的思考時，最容易催生出有創見的思維"}, {"number": 59, "text": "World Café 運作原理 ◎集體心得的收成與分享 經過幾回合的對話之後，再進行全體 對話 集體知識的紀錄與呈現"}, {"number": 60, "text": "World Café 的適用情境 ◎ 分享知識、激發創新思維、建立社群，以及針對 現實生活裡的各種議題和問題展開可能性的探索 ◎ 針對重大的挑戰和機會點，展開深入探索 ◎ 讓首度碰面的人可以展開真正對話 ◎ 為現存團體裡的成員們建立更好的關係，讓彼此 對團體有認同感 ◎ 在說者和聽者之間創造有意義互動 ◎ 當團體人數至少超過12人以上為宜 ◎ 至少有90分鐘可以進行世界咖啡館"}, {"number": 61, "text": "World Café around the world"}, {"number": 62, "text": "World Café around the world"}, {"number": 63, "text": "World Café around the world"}, {"number": 64, "text": "分享＆討論"}, {"number": 65, "text": "To have known the best, and to have known it for the best, is success in life ～John Mackay Thank you! Danke schön"}]}, {"title": "吳明烈｜成人教育學的發展源起與理論（2026）", "filename": "成人教育學的發展源起與理論2026.ppt", "slideCount": 31, "slides": [{"number": 1, "text": "成人教育學 的發展源起、背景與範疇 吳明烈 終身特聘教授 國立暨南國際大學 諮商心理與人力資源發展學系 終身學習與人力資源發展研究所"}, {"number": 2, "text": "成人教育學 (andragogy)的意涵 此一名詞係源自於希臘字 Andros（成人）和agein（引導）兩字合成。 描述成人學習的理論或說明成人教學行為的一組概念。 andragogy的意思是幫助成人學習的科學和藝術。"}, {"number": 3, "text": "成人教育學的概念源起與發展 成人教育學此一名詞的使用，可追溯到1833年，最早使用此字的是德國文法中學的教師Alexander Kapp；其後南斯拉夫、荷蘭、法國、英國、委內瑞拉等國的學者亦陸續沿用。1967年南斯拉夫的成人教育學者薩維西維克(Dusan Savicevic) 參加波士頓大學美國成人教育之父 M. S. Knowles所主持的夏季成人教育研習活動，提出此一名詞，而為諾爾斯所認識並加以使用，大力推廣，漸為其他學者所認識。"}, {"number": 4, "text": "成人教育學的概念源起與發展 學者M.S.Knowles引進成人教育學此一概念的主要原因有三： 第一項動力：當Knowles還在芝加哥大學從事博論研究時，認為當時的學習理論多半建立在與動物及兒童有關的研究基礎上，看不出與成人學習有何關聯。 第二項動力：受 C.Houle《探索的心靈》(The inquiring mind)一書的影響，此書出版後激發了塔富(A.Tough)在成人教育研究證實成人擁有自我導向的能力，而成人這種自我導向性正式兒童所欠缺的，且有別於兒童的教育學理論。 第三項動力：源自於Knowles參與了為在緬因州(Maine)貝德爾(Bethel)地方的行為科學研究所國家訓練實驗室的一些人際關係的實驗計畫。於此計畫過程中，Knowles深深了解到影響成人在團體中及在較大的社會系統中學習的一些因素。"}, {"number": 5, "text": "成人教育學 (Andragogy)與兒童教育學 (Pedagogy)之不同 學者Knowles以對學習者的看法、學習 者的角色經驗、學習準備度以及學習者取向 等層面來比較成人教育學與兒童教育學的差 別："}, {"number": 6, "text": "(表二)"}, {"number": 7, "text": "各國對成人教育學的共識 為了使成人教育發展成為一門科學的學科，建構成人教育理論是有必要的。 人生各個發展階段各有其特殊性，所以成人必須用符合成人需求及特性的方法來教育。 成人教育學與兒童教育學有所不同，成人教育學適合幫助成人學習，兒童教育學則適合用來幫助兒童學習。"}, {"number": 8, "text": "成人教育社會學的意義 成人教育社會學是探討成人教育與社會之間交互關係科學研究的學科；其運用社會學觀點與概念分析成人教育現象、制度與問題，以充實成人教育學與社會學理論，並進而改善成人教育，促進社會進步。（上述定義涵蓋理論目的與應用目的）"}, {"number": 9, "text": "成人教育社會學的學科本質： 自主獨立的學科？"}, {"number": 10, "text": "發展中的成人教育社會學 成人教育社會學是介於成人教育學與社會學的一門學科。其在學術研究領域中，是一門較為新興的學問。因此，就本質與內涵、理論與方法……等等都正處發展階段中。"}, {"number": 11, "text": "何謂理論？ 理論是一種敘述，其在說明某些概念或變項相互關聯的論述。"}, {"number": 12, "text": "理論的效用"}, {"number": 13, "text": "成人教育社會學的研究範疇"}, {"number": 14, "text": "成人教育社會學的研究方法 發現研究主題：微觀或鉅觀 確立研究目的與問題 應用適當的研究方法 文獻深度探討與現象分析 深入研究尋找對策或發展理論 再批判與分析完成研究"}, {"number": 15, "text": "成人教育社會學的論辯 J. H. Knoll：成人教育社會學不應該單獨被探討，而應該是成人教育的社會學觀點。成人教育與社會學的遇合，事實上才興起於一九六０年代，對此亦曾產生一個疑問，究竟成人教育的主導學科應為教育學或社會學？成人教育的問題探討與社會脈絡緊密相連，未來成人教育的社會學研究，應該視研究主題的不同，而結合不同的學科，譬如少數族群問題，不僅要從社會學角度來探討，亦需從人類學、比較文化學及宗教學等觀點進行分析。"}, {"number": 16, "text": "近來成人教育文獻常出現之 社會學專業術語與概念 全球化(globalization) 風險社會(risk society) 公民社會(civil society) 知識社會(knowledge society) 公民素養(citizenship) 社會融合(social inclusion) 社會排斥(social exclusion) 社會變遷(social change) M 型社會 社會統合(social integration) 社會凝聚(social cohesion) 社會平等(social equality) 社會參與(social participation) 社會運動(social movement) 人力資本(human capital) 社會資本(social capital) 文化資本(cultural capital) 新學習文化（new learning culture)……"}, {"number": 17, "text": "成人教育的社會功能 成人教育是社會的現象，故成人教育實施的結果必然會對社會產生影響，亦即成人教育必有其社會功能存在。以下提出成人教育的八個社會功能："}, {"number": 18, "text": "一、社會化功能 社會化不僅是從上一代到下一代傳遞知識文化的傳統課程，也包括與世界交互作用的終身歷程。 成人與兒童社會化的差異 成人強調動機，關心價值；兒童強調知識與能力，關心行為。"}, {"number": 19, "text": "二、提供技術勞工增進經濟效益 成人教育的功能之一乃在於維持或提高人力資源，以發展經濟上的競爭力。 過去三十年來經濟型態改變，勞動市場競爭激烈，使得成人學生大量增加，而正規成人教育體系也扮演了更積極的角色。"}, {"number": 20, "text": "三、促進社會流動 促進不同社會階層的人能有更好的向上社會流動。"}, {"number": 21, "text": "四、提供第二次教育機會 協助晉升個人地位 由於現代社會的進步、複雜、動態與繼續變遷，使得第二次教育顯得特別重要。因為它不僅可以幫助個人提升社會地位，對於社會的安定貢獻也很大。 提供第二次教育機會的機構：如英國的開放大學。"}, {"number": 22, "text": "五、促成現代社會休閒時間合理 安排，並發展相關機構 高科技時代來臨，促使個人工作時間縮短，休閒時間增多，退休時間提早，平均壽命延長，休閒教育在現代社會中扮演著重要角色。關於休閒教育的議題有兩個： 1.如何安排休閒生活的教育 2.如何吸引成人將教育視為休閒活動為 重要課題"}, {"number": 23, "text": "六、協助成人充分「發展」 獲得社會生活的「自由」 成人教育不但要使人活的有尊嚴、有價值，而且要幫助他繼續不斷成長。 成人教育的充分發展可協助個人獲得自由，使心胸更為開闊，並善用人生的每一階段。"}, {"number": 24, "text": "七、傳遞現有知識文化維護現行社會體系 各類成人教育工作都透過現有知識的傳授及文化的傳遞維持現行體系，復演現行社會關係有並有助於社會現況的安定。。"}, {"number": 25, "text": "八、導致社會行動形成社會變遷 社會行動是個人從事各種社會改革的努力表現，成人教育除了維持社會安定外，更應該激發各種社會行動導致個人機構及社會的變遷，以便協助成人改進社會現況，並促成社會進步。"}, {"number": 26, "text": "年齡增長與智力的變化 流質智力和晶質智力 1.是為測量成人智力的主要概念 2.兩種智力依循極為不同的路徑來發展 3.流質智力：係有關個體天生的能力，亦為個人處理訊息的基本能力 4.晶質智力：由經驗和教育上所獲得的知識，代表文化知識方面的智力"}, {"number": 27, "text": "流質智力 發展狀況： 兒童時期開始→經青少年期達高峰→成年期(20歲)後逐漸下降(可能與神經生理結構改變有關) 實際反應在現實的狀況： 1.知覺抽象關係 2.短期記憶 3.對環境立即的認識與瞭解 4.抽象推理能力 5.形成觀念"}, {"number": 28, "text": "晶質智力 發展狀況： 不隨年齡增長而下降，有隨經驗增加和終身學習的活動之進行而持續增長 實際反應在現實的狀況： 1.一般常識 2.字彙、語文瞭解 3.數學能力 4.應付社會情況能力 5.訊息的理解"}, {"number": 29, "text": "流質及晶質智力與年齡的關係圖"}, {"number": 30, "text": "結語 成人教育領域結合了哲學、社會科學及心理學要素，成為一個綜合性的領域。成人教育成為一個許多學術次領域的獨特綜合體，並不會減低其學術的精密程度；反而會刺激後續的學者以更廣泛的觀點，在分化與融合的知識過程中，將其觀念注入成人教育知識主體永續變化的洪流中，以豐碩其知識領域。 並且因為它是一直在進行當中，所以會隨著因應社會變遷而擴充其領域，使得成人教育變得更具豐富與多樣性。 115/11/23 <number>"}, {"number": 31, "text": "To have known the best, and to have known it for the best, is success in life ～John Mackay Thank you! Danke schön"}]}, {"title": "吳明烈｜歐美成人教育機構組織與資源（2026）", "filename": "1006歐美成人教育機構組織與資源2026 (2).pptx", "slideCount": 23, "slides": [{"number": 1, "text": "歐美成人教育機構組織與資源 吳明烈 終身特聘教授 國立暨南國際大學 諮商心理與人力資源發展學系"}, {"number": 2, "text": "前言"}, {"number": 3, "text": "影響國際終身學習的重要組織 及其推展內涵"}, {"number": 4, "text": "一、影響國際終身學習發展的重要國際組織及其推展方向 影響國際終身學習發展的重要國際組織及其推展方向"}, {"number": 5, "text": ""}, {"number": 6, "text": ""}, {"number": 7, "text": ""}, {"number": 8, "text": "影響國際終身學習發展的重要成人教育專業組織及其推展方向 歐美各國亦有影響國際終身學習發展的重要成人教育專業組織，對終身學習的新發展發揮了實質效益與莫大貢獻"}, {"number": 9, "text": "EAEA：重要終身學習非政府組織 歐洲成人教育學會為深深影響歐洲終身學習發展的重要非政府組織，成立於1953年，旨在連結與促進歐洲成人學習的發展。當前主要致力於以下各項政策影響領域 https://conference.eaea.org/"}, {"number": 10, "text": "英國學習與工作研究所 傾聽終身學習之聲 英國成人及繼續教育協會(National Institute of Adult Continuing Education)被稱為全國終身學習之聲，這是一個成立於 1921 年的英國成人教育機構，長期致力於倡導和推廣成人學習與技能提升。該機構已於 2016 年 1 月 1 日與經濟和社會包容中心（CESI）合併，正式更名為學習與工作研究所（ Learning and Work Institute），持續致力於高品質的教育培訓體系，以滿足不同的成人學習需求，促進成人及潛在學習者的教育權益，推動方向主要以右列各項為主軸 https://learningandwork.org.uk/cy/"}, {"number": 11, "text": "DIE：專業化終身學習研究機構 https://www.die-bonn.de"}, {"number": 12, "text": "AAACE：深化終身學習理論與實務的拓展者 https://www.aaace.org"}, {"number": 13, "text": "國際終身學習大趨勢"}, {"number": 14, "text": "建構學習型城市 資料來源：UNESCO Institute for Lifelong Learning, 2014:29"}, {"number": 15, "text": "推展高齡學習以促進活躍老化"}, {"number": 16, "text": "擴展職場學習"}, {"number": 17, "text": "發展成人關鍵能力與生活技能"}, {"number": 18, "text": "建立學習成就認可制度"}, {"number": 19, "text": "全面擴展成人學習週"}, {"number": 20, "text": "促進弱勢團體及低學習參與者的學習"}, {"number": 21, "text": "確保終身學習品質與卓越"}, {"number": 22, "text": "結語"}, {"number": 23, "text": "Thank you Danke schön"}]}, {"title": "吳明烈｜社區大學的永續發展策略", "filename": "1103社區大學的永續發展策略.ppt", "slideCount": 42, "slides": [{"number": 1, "text": "社區大學的永續發展策略 吳明烈 終身特聘教授 國立暨南國際大學 諮商心理與人力資源發展學系"}, {"number": 2, "text": "前言 1998年台灣推展終身學習的重要里程碑 社區大學邁向下一個黃金十年 社區大學在終身學習時代的角色功能與未來願景"}, {"number": 3, "text": "前言 2002年政府公佈終身學習法，將社區大學明確定位為終身學習機構，促進了社區大學的蓬勃發展 社大的蓬勃發展，除了得力於政府部門的支持，另一方面也得力於民間力量的整合"}, {"number": 4, "text": "社區成人教育學校的國際視野 台灣社大的規模與體制，是典型的社區成人教育學校或社區成人學習中心 歐美先進國家均設有社區成人教育學校 丹麥成人教育之父Grundvig創辦了人類史上第一所民眾高等學校，強調心靈的成長與解放教育"}, {"number": 5, "text": "丹麥成人教育之父Grundvig 民眾高等學校建立的目的在於為民眾教育，為民眾啟蒙 Grundvig認為成人教育應是一種心靈的激發與啟發，受此思想影響，第一所民眾高等學校於1844年在羅登（Rodding）創立 丹麥民眾高等學校不僅為歐洲國家所效法，亦擴及到亞洲、非洲及北美地區的若干國家"}, {"number": 6, "text": "德國的民眾高等學校 丹麥的民眾高等學校影響德國，並成為德國重要的終身學習機構 德國各地約有1010所民眾高等學校及4100所民眾高等學校教育中心(Volkshochschul-Arbeitsstelle) 1990年代以來，民眾高等學校亦以目標團體為導向的終身學習，作為一項重要的工作原則"}, {"number": 7, "text": "德國的民眾高等學校 除了傳統的夜間課程，近年更注意到彈性時間的繼續教育服務 許多課程係視學習者的需要，而於白天或假期中進行 民眾高等學校是德國高齡教育活動最大的提供者，很多高齡者較少參加專以高齡者目標團體為導向的學習活動，而是參加一般成人的課程"}, {"number": 8, "text": "民眾高等學校對德國高齡教育的影響 民眾高等學校是德國實施高齡教育最具成效的機構之一 民眾高等學校原本就有實施高齡教育的傳統，於1960年代更加強了高齡者的文化與教育措施"}, {"number": 9, "text": "德國民眾高等學校的成就 為利於成人就近學習，亦發展了所謂的行動民眾高等學校(Mobile Volkshoshchule, MVHS)，將學校供給結構從傳統的成人走向民眾高等學校參與學習，轉為民眾高等學校走向成人，促進成人就近學習 提升民眾生活素養與生活品質"}, {"number": 10, "text": "德國柏林民眾高等學校"}, {"number": 11, "text": "德國柏林民眾高等學校"}, {"number": 12, "text": "德國柏林民眾高等學校"}, {"number": 13, "text": "德國柏林民眾高等學校"}, {"number": 14, "text": "德國柏林民眾高等學校"}, {"number": 15, "text": "德國柏林民眾高等學校"}, {"number": 16, "text": "德國柏林民眾高等學校"}, {"number": 17, "text": "德國柏林民眾高等學校"}, {"number": 18, "text": "美洲的社區學院community college 以美國為代表 高等教育與中等教育的雙重性質 介於正規教育與非正規教育之間 社區學院的緣起與發展，係基於打破傳統教育的不平等與彌補教育的不足等理念 最主要的成立目的為轉學教育，作為高中與四年制大學的橋樑，修畢課程可獲得副學位學士，並轉入大學三年級就讀"}, {"number": 19, "text": "美洲的社區學院community college 近年來除了傳統轉學課程，亦提供補救教育與提昇工作力的課程，並漸漸朝向社區本位及地區中心的多元終身學習機構發展 台灣社區大學的發展規模與運作方式，較相似歐洲的民眾高等學校"}, {"number": 20, "text": "我國社區大學的再定位與功能探討： 三種重要觀點 社大全促會觀點 政府觀點 不只是教育機構，更是社會運動機構，透過教育與社會改革，促進公民社會的發展 企盼社區大學能持續積極扮演終身學習機構之角色，甚至是終身學習機構的典範，提供最完善的學習服務給社區民眾，進而促進個人發展 社會大眾 觀點 從台灣整體教育與社會發展的需要加以考量，透過終身學習法明確釐清社區大學的定位，讓終身學習機構與非正規教育機構，與現存之高等教育體制有所區隔，希冀有所互補"}, {"number": 21, "text": "我國社區大學的再定位與功能探討（續） 三方觀點雖有不同，但都認為對於社區大學的關懷與行動，應該受到重視，莫不希望社區大學在現有基礎上，持續發揮功能 三方共同點 社區大學要扮演積極的終身學習機構角色，這是社大最主要的任務與發展方向"}, {"number": 22, "text": "社區大學的三種角色定位 非正規教育機構 社區發展促進者 終身學習機構 1970年代以來，聯合國教科文組織（UNESCO）、經濟合作發展組織（OECD）、歐洲聯盟以及其他重要國際組織，均明確闡述終身學習的意義與觀點 各國均將社區大學定位為終身學習機構，社大實現了終身學習意涵中所強調的自我實現與社會發展，可說是定位具體明確，功能兼顧到了個人發展與社會進步等面向 非正規教育包括任何有組織與持續性的教育活動，可以發生在教育機構之內或之外，並且為各種年齡層的人提供服務 社區大學扮演的非正規教育機構角色，可以充分發揮這項以往較被忽視的重要教育功能，甚至將來可成為非正規教育的主流，進而強化整體教育體系的發展 社區大學與社區有密切關係，部份社大工作者所強調的社會改造運動，即可在這個角色扮演上有所發揮 社區終身學習是社區永續發展的關鍵與命脈，透過社區學習的推動，進而促進社區總體營造之發展。造景、造產、造人及造文化堪稱社區總體營造的四大支柱，四者係互為一體且相輔相成，構成社區總體營造的架構與內涵。社造理想的實現，有賴於社區大學在造人方面多加著力"}, {"number": 23, "text": "社區大學三種角色定位所發揮的四大功能 提升我國成人終身學習參與率 促進台灣學習社會的實現 增進發展學習型社區 正規教育的互補及相輔相成 任何組織存在的價值，在於對本身定位有充分之認識，並了解組織在整體社會中所應扮演的角色，並且充分發揮功能，成為無可取代的組織。展望未來，社區大學更應成為推動終身學習的典範機構，促進台灣學習社會與公民社會理想之實現"}, {"number": 24, "text": "社區大學的永續發展策略： 新願景、新發展、新未來"}, {"number": 25, "text": "社大永續發展策略：願景的再思考 過去社大發展理念與目標 知識解放 催生公民社會 透過學習課程的提供，促進知識的普及擴散，讓全民均能提昇知識層面與層次 強調深化公民素養，提昇民眾的社會參與力，共同創建優質公民社會"}, {"number": 26, "text": "社區大學所面臨的多元觀點 願景的塑造應是重學習社會的實現還是公民社會的催生？ 現代社會中，應採用民眾知識解放的論調或是全民終身學習的觀點？ 落實在地化社區之餘，應再結合政府、成人教育學者、社區大學、學習者等進一步對話討論"}, {"number": 27, "text": "社區大學未來願景發展的四項思考 發展組織本身的優勢， 並善用優勢創造更多成果 充分回應整體社會的需求 與發展機會 讓全體參與者相信 這確是未來可實現的願景 願景必須同時有利於學員、 社大、社區以及社會的發展"}, {"number": 28, "text": "社大永續發展策略： 落實社區大學法制化 2002年所訂立的終身學習法，僅對社區大學的定位與經營方向有概括性的描述，尚缺全面性的詳述，以致部份社區大學工作者認為該法對社大的發展效果不彰 未來有需要在終身學習法中，另立專章或設置條例以具體明訂關於社區大學的發展"}, {"number": 29, "text": "社大永續發展策略： 落實社區大學法制化（續） 社區大學條文法令的修訂 應傾聽各級政府、社區大學、終身教育專家學者以及社會大眾多元的聲音，據以凝聚共識 社會對話的過程 有關社區大學是否有必要同時具備正規教育機構的功能，是否提供學位課程或另闢經營模式等，均可逐一提出 進而找到確切之社區大學永續發展之道 塑造出社區大學的形象品牌"}, {"number": 30, "text": "社大永續發展策略： 創新組織發展模式 台灣在成立社區大學之初，已參照各國的發展經驗，一步一腳印的建構出與歐美各國不同的發展模式 仍需朝著組織創新經營模式邁進，同時維持在地化特色，讓各社區大學能因地制宜多元化發展 目前社大呈現為公辦公營或公辦民營的模式，未來可鼓勵民間興學，另增闢民辦民營的模式"}, {"number": 31, "text": "社大永續發展策略： 健全經費運作機制 目前經費的來源主要來自於教育部的補助與獎助、縣市政府的委辦經費及學分費。然而，各縣市政府對社區大學的認知與支持的情況不一，因此所獲得之經費亦有所不同 根據終身學習法規範，縣市政府為社區大學委辦單位，經費補助自應比中央政府為多 適當的學分費收入，應成為社大主要經費來源之一"}, {"number": 32, "text": "社大永續發展策略： 健全經費運作機制（續） 為確保社大永續發展，需政府、社大本身、 社會大眾共同努力 政府允宜再詳加精算 與確立經費補助模式 社會大眾的力量 與民間資源挹注 民間興學向來是 一種社會美德 中央政府與地方政府在經費補助方面應各自扮演何種角色，經費補助的依據與比例為何，均應非常精準化與明確化 終身學習有益於個人成長發展，個人應建立起樂意為終身學習付費之觀念，對於社大所提供之課程不應抱持免費或低學費的心態，對弱勢族群或低收入者則可給予學費優惠 無論是企業、非營利組織或是個人均應受到鼓勵以參與社會教育事業，共同扶持社區大學之發展"}, {"number": 33, "text": "社大永續發展策略： 發展策略聯盟夥伴關係 終身學習社會的發展，乃是一種群策群力的關係，所有行動者均扮演著關鍵角色，彼此間應建立起熱絡的夥伴關係，共同為終身學習的發展而共同努力 策略聯盟夥伴關係的發展，緣起於企業界，有助於資源整合，並發揮良好綜效 策略聯盟涵蓋了市場聯盟、產品聯盟以及發展聯盟等方式"}, {"number": 34, "text": "社區大學的策略聯盟 市場聯盟 產品聯盟 發展聯盟 應著重如何擴大終身學習的市場，吸引更多的人從事學習活動，並促使終身學習機會的提供，能獲得適當而合理之分配 應力促教學方法的改善，以提昇學習者的學習品質與學習成效，並促使學習者在受過完整的教育後，能產生適宜的改變 應持續擴展終身學習機構的發展潛力，積極擴展與善用學習資源，並建立起終身學習的最佳實務"}, {"number": 35, "text": "社區大學發展策略聯盟的三種模式 垂直式 水平式 混合式 與具有互補功能的不同機構建立夥伴關係，以提昇組織的研發功能與產銷功能，如建教合作、產銷合作、擴大服務項目等 結合功能類似的機構，有效運用既有資源，以擴大服務的點與面，如連鎖店 垂直式與水平式的策略聯盟，以全面提昇組織的競爭力與發展力 多元策略聯盟模式 積極與政府機構、大學、企業、非營利組織、各社大以及其他相關組織積極合作製造全贏，並透過市場聯盟、產品聯盟以及發展聯盟等方式，全面提昇社區大學的發展力"}, {"number": 36, "text": "社大永續發展策略： 市場區隔與塑造特色 社區大學應成為非正規教育體系的重要支柱，並與傳統的正規教育機構有明確之市場區隔，成為台灣建立學習社會的重要力量 塑造社區大學的特色，一方面要符合社區需求與社會需要，另一方面則需善用本身優勢條件與資源，再來凝聚發展之主軸重點"}, {"number": 37, "text": "社大永續發展策略： 市場區隔與塑造特色（續） 社大實踐主軸： 知識解放 學術性課程 社團性課程 藝能性課程 各類課程反應出與民眾日常生活接觸最為頻繁的連結 塑造特色過程中，品牌經營與感動服務乃不可或缺，並促使民眾在社大的學習過程中，產生一種難能可貴的生命感動"}, {"number": 38, "text": "社大永續發展策略： 成為專業化的終身學習機構典範 社大可謂當代台灣社會最具成人教育特色的終身學習機構 社大工作者不僅是成人教育工作者，更是終身學習專業工作者 依據終身學習法的規定，終身學習機構應優先聘用終身學習專業人才 社區大學應成為專業化的終身學習機構，持續擴展成人學習參與量，提升成人學習品質"}, {"number": 39, "text": "社區大學專業化的人力發展 師資專業化 行政人員專業化 志工專業化 社區大學師資所面對者均為成人學生，亦非傳統學生，成人有獨特的心理發展與學習特性，教師需經過成人教育專業知能之培訓，未來應明確規定社大教師培訓課程內容與時數 社區大學行政主管與人員均亦接受成人教育專業培訓，進而更了解成人教育，提供更完善的服務與促進行政品質 志工是社大極具活力的人力資源，志工專業化的培訓發展，一方面是志工學習權益，另一方面則是落實志工服務品質的良策"}, {"number": 40, "text": "落實社區大學評鑑制度 各項評鑑層面指標、評鑑方式、獎勵規範以及追蹤改善等內容流程，均應逐一詳加檢視，使其更為客觀化，發揮評鑑效度與功能 經由專業評鑑，可引導專業實務的發展，提供專業改善之參考，是社區大學不可忽視之專業化永續發展策略"}, {"number": 41, "text": "創造屬於社區大學的品牌故事 以終身學習創造社區大學品牌故事 永續發展不應僅是社區大學一項發展理想，更應成為一種社會事實"}, {"number": 42, "text": "美好理想的實現，猶如凡鐵鑄成寶劍的過程，即使寶劍尚未鑄成，但也已非當時的那塊凡鐵，一切的努力已有了改變 ～吳明烈 Thank you! Danke schön"}]}, {"title": "吳明烈等｜112年度成人教育調查成果簡報", "filename": "112年成人教育調查報告2025.pptx", "slideCount": 87, "slides": [{"number": 1, "text": "112年度成人教育調查 計畫主持人：吳 明 烈 終身特聘教授 國立暨南國際大學 諮商心理與人力資源發展學系 共同主持人：李 藹 慈 教授 國立中正大學 研 究 助 理：陳建廷、鄭俊希"}, {"number": 2, "text": "調查概述 2"}, {"number": 3, "text": "3 97 年度調查 111年度調查 歷年成人教育調查 109年度調查"}, {"number": 4, "text": "調查背景與重要性 打造全民愛學習的學習型臺灣是當前重要的教育政策 成人教育參與情形是評量終身學習實施成效的一項重要指標 延續教育部過去十次成人教育調查統計 推動 調查 指標 4"}, {"number": 5, "text": "各國成人教育調查情形(1/2) 國家 / 調查機構 / 出版年度 / 調查年齡 / 調查方法 / 調查頻率 / 參與比例 德國 / 德國聯邦教育與研究部 / 2024 / 18-64 / 電腦輔助面訪 / 2年 / 64% 英國 / 學習與工作研究所 / 2023 / 17歲以上 / 網路調查 / 1年 / 49% 美國 / 美國教育科學院國家教育統計中心 / 2020 / 16-74 / 紙筆測驗、電腦測驗 / NA / 59.7% 法國 / 法國國家統計與經濟研究所 / 2024 / 18-69 / 電腦輔助面訪 / 6年 / 50.8% 荷蘭 / 荷蘭中央統計局 / 2024 / 18-69 / 電腦輔助網路訪談 / 6年 / 65.5% 挪威 / 挪威統計局 / 2023 / 15-66 / 電訪 / 2年 / 54% 5"}, {"number": 6, "text": "各國成人教育調查情形(2/2) 國家 / 調查機構 / 出版年度 / 調查年齡 / 調查方法 / 調查頻率 / 參與比例 丹麥 / 丹麥統計局 / 2024 / 18-69 / 電腦輔助網路訪談、電訪 / 6年 / 53% 瑞典 / 瑞典統計局 / 2024 / 18-69 / 電腦輔助網路訪談、電訪 / 6年 / 73.9% 芬蘭 / 芬蘭統計局 / 2023 / 18-64 / 網路問卷、面談 / 6年 / 47% 韓國 / 韓國教育開發院 / 2024 / 25-79 / 面訪 / 1年 / 32.3% 澳洲 / 澳洲統計局 / 2022 / 15-74 / 面訪、電訪 / 3年 / 42.1% 西班牙 / 西班牙國家統計局 / 2024 / 18-69 / 網路問卷、電訪、面訪 / 6年 / 50.6% 義大利 / 義大利國家統計局 / 2023 / 18-74 / 電腦輔助網路訪談、電訪 / 6年 / 34.5% 臺灣 / 教育部 / 2024 / 18歲以上 / 電腦輔助電訪 / 1年 / 42.82% 6"}, {"number": 7, "text": "112年度成人教育調查問卷 學習參與情形 基本資料 第一部分 第二部分 共計9題 性別、年齡、教育程度、個人年收入、婚姻狀況、居住縣市及鄉鎮等 共計20題 非正式學習(8題) 正規與非正規學習(12題) 問卷內容主要分為兩大部分 7"}, {"number": 8, "text": "調查目的 8"}, {"number": 9, "text": "調查目的 1. 瞭解成人教育參與現況。 2. 分析不同背景成人參與終身學習的差異情形。 3. 分析不同地區及縣市成人參與終身學習的差異情形。 4. 探究成人終身學習機構的經營現況。 5. 提供研擬成人終身學習政策之參據 。 9"}, {"number": 10, "text": "調查方法 10"}, {"number": 11, "text": "調查方法 調查範圍 臺閩地區，共計 22 個縣市 調查對象 全國年滿18歲(含)以上的成人，不含正規教育學制在學學生 調查時期 2024年1月至12月 資料蒐集方法 市話調查之抽樣方式搭配NCC市話局碼資料庫暨使用量及分層多階段RDD-PPS隨機抽樣法進行市話調查抽樣 手機調查之抽樣方式係以NCC會同各電信公司所提供之資料為依據進行不分區的簡單隨機抽樣 調查工具 教育部 112 年度成人教育調查問卷 採問卷調查法 11"}, {"number": 12, "text": "調查方法 12 都市差異 / 六都 / 縣市佔全國 比例2%以上 / 縣市佔全國 比例1%～2% / 縣市佔全國 比例1%以下 預計樣本數 / 500份 / 350份 / 200份 / 100份 實際樣本數 / 502～510份之間 / 351～356份之間 / 200～201份之間 / 100～104份之間 縣市 / 臺北市、新北市、桃園市、臺中市、臺南市、高雄市 / 新竹縣、苗栗縣、 彰化縣、南投縣、雲林縣、嘉義縣、屏東縣 / 基隆市、新竹市、嘉義市、宜蘭縣、花蓮縣 / 臺東縣、澎湖縣、金門縣、連江縣 95%信心水準下， 抽樣誤差 / ±4.34%至±4.37% / ±5.19%至±5.23% / ± 6.91%至± 6.93% / ± 9.61%至± 9.80% 調查各縣市樣本配置，以固定份數分配，都巿差異做為配置原則，預計訪問6,850份有效樣本，實際總樣本數為6,912份。為符合各縣市實際人口分佈之比例，故對各縣市做加權處理。"}, {"number": 13, "text": "調查方法 13 居住地區 /  / 縣市預計樣本數 / 縣市實際抽樣數 總計 /  / 6,850 / 6,912 北部地區 / 新北巿 / 500 / 510  / 臺北市 / 500 / 504  / 基隆市 / 200 / 200  / 桃園市 / 500 / 502  / 新竹縣 / 350 / 356  / 新竹市 / 200 / 201  / 宜蘭縣 / 200 / 201 中部地區 / 苗栗縣 / 350 / 351  / 臺中市 / 500 / 505  / 彰化縣 / 350 / 353  / 南投縣 / 350 / 351  / 雲林縣 / 350 / 352 居住地區 /  / 縣市預計樣本數 / 縣市實際抽樣數 南部地區 / 嘉義縣 / 350 / 354  / 嘉義市 / 200 / 201  / 臺南市 / 500 / 503  / 高雄市 / 500 / 506  / 屏東縣 / 350 / 356  / 澎湖縣 / 100 / 100 東部及外島地區 / 花蓮縣 / 200 / 200  / 臺東縣 / 100 / 104  / 金門縣 / 100 / 101  / 連江縣 / 100 / 101 樣本抽取與配置"}, {"number": 14, "text": "調查方法 14 調查過程概述"}, {"number": 15, "text": "個人問卷市話電訪紀錄表 15 註1：合格樣本推估比例計算方式為 e = (I+R+NC) / (I+R+NC+NE) = 17.4%。 註2：合格樣本成功率計算方式為 I / (I+R+NC+e*(UH+UO)) = 36.4%。 註3：有效接觸成功率計算方式為 I / (I+R) = 87.0%。 註4：拒訪率計算方式為 R / (I+R+NC+e*(UH+UO)) = 5.4%。 註5：接觸率計算方式為 (I+R) / (I+R+NC+e*(UH+UO)) = 41.8%。 單位：人 電訪狀況 /  / 個數 / 總計 有接觸 / 【I】訪問成功 / 5,378 / 5,378  / 【R】合格拒訪 / 801 / 801  / 【NC】合格無法接觸 / 755 / 755  / 【UH】無法確定是否為家戶 /  / 31,612  / 無人接聽 / 29,220 /   / 電話忙線 / 2,392 /  未接觸 / 【UO】無法確定家戶內有無合格者 / 13,409 / 13,409  / 【NE】無合格 項之成人參與正規與非正規學習比例 7/8 29 參與率以服務業者為最高，佔55.63%，其次為工業者，佔45.27%"}, {"number": 30, "text": "不同背景變項之成人參與正規與非正規學習比例 8/8 30 參與率以擔任專業人員者為最高，佔70.76%， 其次為技術員及助理專業人員者，佔60.57%"}, {"number": 31, "text": "參與學習的性質 31 多數受訪者參與非學歷、學分、證照之課程，佔整體78.29%"}, {"number": 32, "text": "參與學習的類型 32 註：往年調查為複選題，自2014年改為單選題，增加兩者皆有參與選項，本圖呈現已將數據各自加回。 參與學習的類型為職業成人教育>普通成人教育"}, {"number": 33, "text": "參與學習活動主題-職業成人教育 33 以商業管理佔27.87%為最高，其次為資訊科技佔12.47%，第三則為教育/心理佔10.19%"}, {"number": 34, "text": "參與學習活動主題-普通成人教育 34 以健康休閒佔46.89%為最高，其次為藝術文學佔10.67%，第三則為語言系列佔7.65%"}, {"number": 35, "text": "成人參與媒體素養教育活動的比例 參與媒體素養教育活動 / 百分比 有 / 26.39 沒有 / 73.61 我國成人有參與媒體素養相關教育活動的比例為26.39% 不同地區者，以東部及金馬地區佔41.35%最高。 不同年齡者，以18-24歲者佔32.03%為最高。 35"}, {"number": 36, "text": "參與學習的動機 36 動機以職業進展比例最高，佔37.66%， 其次為認知興趣，佔36.85% ，第三則為外界期望，佔15.96%"}, {"number": 37, "text": "參與學習的主要機構 37 成人參與學習活動的主要機構性質以企業組織為主，佔整體35.37%；其次則為政府所屬教育訓練機構，佔整體22.32%"}, {"number": 38, "text": "各地區參與學習比例 38 參與率以北部地區為最高，佔45.76%，其次為東部及金馬地區者，佔41.11%"}, {"number": 39, "text": "各縣市參與學習比例 39 參與率以新竹市為最高，佔50.75%，其次為臺北市者，佔48.21%"}, {"number": 40, "text": "參與學習經費來源 40 學習經費來源以自己支付為主，佔39.23% 其次來源為雇主補助，佔25.22%；第三為政府補助，佔23.59% 其餘經費來源皆未達10%"}, {"number": 41, "text": "參與學習的訊息管道 41 學習的訊息管道以公司告知為最高，比例佔26.23% 其次為網路告知，佔23.76%"}, {"number": 42, "text": "參與學習的整體滿意度 42 非常滿意佔18.84%；滿意72.49%；普通5.76%；不滿意2.79%；非常不滿意0.12% 參與學習後，超過九成之受訪者感到滿意"}, {"number": 43, "text": "參與學習帶來的助益 43 97.09%的受訪者認為學習有帶來幫助 學習後的助益以職業晉升層面為最高，佔51.60%；其次為自我效能層面，佔22.65%；第三為身心層面，佔20.13%"}, {"number": 44, "text": "參與學習的障礙類型 44 未參與學習之障礙以情境障礙為最高，佔54.18%； 其次依序為訊息障礙，佔31.26%；機構障礙佔7.98%；意向障礙佔6.58%"}, {"number": 45, "text": "未來學習的意願及需求 45 學習意願以語言系列最高，佔39.44%； 其次為資訊科技，佔18.28%；第三為環境生態，佔16.22%"}, {"number": 46, "text": "調查結果-現況 46 成人參與非正式學習-個人層面"}, {"number": 47, "text": "閱讀知識性書報雜誌學習 47 36.51%的受訪者有閱讀知識性書報雜誌進行學習 每週閱讀平均天數以1至2天閱讀為最多，佔46.91% 每天閱讀平均時數以1至未滿2小時最多，佔45.94% 旅遊學習 29.71%的受訪者有透過旅遊進行學習 以每年1至2次旅遊為最多，佔51.54% 每次旅遊平均天數以2至未滿4天最多，佔42.97%"}, {"number": 48, "text": "電視節目學習 48 59%之受訪者有透過電視節目進行學習 學習狀況以觀看一般知識性節目為多數，佔78.87%"}, {"number": 49, "te 我效能層面 臺閩地區成人參與學習活動最主要的障礙，以情境障礙為主，其次依序為意向障礙、機構障礙及訊息障礙；其中又以對學習不感興趣比例最高，其次為工作限制"}, {"number": 78, "text": "78 正規與非正規學習 6/6 臺閩地區成人對於未來參與學習活動類型需求以健康休閒類最高，其次為語言系列，再則為資訊科技類 非正式學習 臺閩地區成人職場學習方式以關係導向為主，其次依序為科技導向、經驗導向、教育導向及物件導向，且不同背景變項成人的職場學習方式亦有所差異 臺閩地區成人非正式學習以透過數位學習進行學習為主，其次依序為電視節目、閱讀知識性書報雜誌學習及旅遊學習 17"}, {"number": 79, "text": "79 影響成人教育參與率之關鍵背景變項 影響各縣市成人教育參與率之關鍵背景變項為教育程度、職業別、行業別、個人年收入及勞動情況 影響樂齡者教育參與率之關鍵背景變項為行業別"}, {"number": 80, "text": "80 成人教育機構1/3 臺閩地區終身學習機構學習活動形式以系列性課程為主；學習活動屬性以一般課程或活動為多；學習活動類別以健康休閒系列最高 臺閩地區終身學習機構在學習資源上，提供免費學習活動者比例最高，其次是有學費優惠；提供托幼服務比例為10.21%，而提供托老服務比例為2.22% 臺閩地區終身學習機構有開設終身學習專業人員培訓課程活動之比例為20.96%，不同類型終身學習機構對外開設培訓課程活動之比例又以其他終身學習機構最高，其次為新住民家庭服務中心，第三為空中大學及家庭教育中心"}, {"number": 81, "text": "81 成人教育機構2/3 臺閩地區終身學習機構志工培訓方式以講座為主，其次為參訪觀摩 臺閩地區終身學習機構進行策略聯盟方式以同業結盟最多，且機構對於策略聯盟之成效具高度正面的肯定 臺閩地區終身學習機構對於教師審核，最重視教師經歷，其次為學歷"}, {"number": 82, "text": "82 成人教育機構3/3 臺閩地區終身學習機構最主要的經費來源，以政府預算補助為主，其次為學費收入，再則為贊助捐款 臺閩地區終身學習機構有經營困境者逾三成，並以人力有限、招生不易及經費短缺為主要限制 臺閩地區終身學習機構在行銷管道上以口碑行銷為最有成效，其次為社群媒體，再則為文宣廣告簡章"}, {"number": 83, "text": "結論與建議 83 建議"}, {"number": 84, "text": "84 對教育主管機關之建議(1/2) 1 3 2"}, {"number": 85, "text": "85 對教育主管機關之建議(2/2) 4 5"}, {"number": 86, "text": "86 對終身學習機構之建議 1 2"}, {"number": 87, "text": "87 對社會大眾之建議 1 2"}]}];
const view=document.getElementById('view'), side=document.getElementById('sidenav'), crumb=document.getElementById('crumb'), search=document.getElementById('search');
const byId=Object.fromEntries(articles.map(a=>[a.id,a]));
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function navSetup(){let h='';let group=''; for(const a of articles){if(a.category!==group){group=a.category;h+=`<div class="navlabel">${escapeHtml(group)}</div>`} h+=`<button class="nav" data-id="${a.id}" onclick="go('${a.id}')">${escapeHtml(a.title)}</button>`}side.innerHTML=h;document.getElementById('stats').innerHTML=`<span class="stat">${articles.length} 篇知識條目</span><span class="stat">${sources.length} 份吳明烈老師授課與研究簡報</span><span class="stat">${sources.reduce((n,s)=>n+s.slideCount,0)} 張投影片文字索引</span><span class="stat">可離線搜尋與瀏覽</span>`}
function home(){crumb.textContent='Wiki 首頁';view.innerHTML=`<div class="alert">閱讀方式：由左側目錄選擇主題，或使用上方搜尋。每個條目都附教材來源與張數，底下的「原始投影片索引」可追溯老師原始簡報。線上查證請另查權威來源。</div><h2 class="sectionhead">核心閱讀路徑</h2><div class="toc-grid">${articles.map(a=>`<button class="tcard" onclick="go('${a.id}')"><b>${escapeHtml(a.title)}</b><span>${escapeHtml(a.category)}</span></button>`).join('')}</div>`}
function articlePage(a){crumb.textContent=`知識條目 / ${a.title}`;view.innerHTML=`<article class="article">${a.content}</article>`}
function sourcePage(){crumb.textContent='吳明烈老師授課簡報 / 投影片文字索引';view.innerHTML=`<div class="alert">索引從您提供的原始 PowerPoint 擷取文字，方便找回老師的講述重點與頁碼。若投影片包含圖片、圖表或未能擷取文字，請以完整原始檔為準。部分資料是歷史教材，不能直接當成2026年最新數據與法規。</div><h2 class="sectionhead">六份來源簡報（點擊展開）</h2><div class="source-list">${sources.map((s,i)=>`<details class="source-entry"><summary>${escapeHtml(s.title)}｜${s.slideCount} 張</summary><div class="slidesource"><p style="color:#658087">原始檔：${escapeHtml(s.filename)}</p>${s.slides.map(x=>`<div class="slide-source"><span>第 ${x.number} 張</span>　${escapeHtml(x.text||'（此頁無可抽取文字，請查閱原始投影片圖像。）')}</div>`).join('')}</div></details>`).join('')}</div>`}
function searchPage(q){crumb.textContent=`搜尋：${q}`;let needle=q.trim().toLocaleLowerCase();if(!needle){home();return}let matches=articles.filter(a=>(a.title+' '+a.text).toLocaleLowerCase().includes(needle));let slides=[];for(const s of sources){for(const x of s.slides){if(x.text.toLocaleLowerCase().includes(needle))slides.push({title:s.title,n:x.number,text:x.text})}}view.innerHTML=`<div class="sectionhead">${matches.length} 篇相關知識條目 · ${slides.length} 張相關原始投影片</div>${matches.map(a=>`<button class="result" onclick="go('${a.id}')"><strong>${escapeHtml(a.title)}</strong><small>${escapeHtml(a.text.replace(/[#\[*|>]/g,'').slice(0,150))}…</small></button>`).join('')}${slides.slice(0,90).map(x=>`<div class="result" style="cursor:default"><strong>${escapeHtml(x.title)} · 第${x.n}張</strong><small>${escapeHtml(x.text.slice(0,600))}</small></div>`).join('')}${slides.length>90?'<p>投影片搜尋結果僅顯示前90筆，可縮小關鍵字範圍。</p>':''}${(!matches.length&&!slides.length)?'<p>沒有找到符合的結果，請換個關鍵字，例如「學習動機」「世界咖啡館」「社區大學」。</p>':''}`}
function go(id){if(id==='home'){home()}else if(id==='sources'){sourcePage()}else if(byId[id]){articlePage(byId[id])}else{home();id='home'}document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.id===id));document.getElementById('sidebar').classList.remove('open');history.replaceState(null,'','#'+encodeURIComponent(id));window.scrollTo(0,0)}
search.addEventListener('input',e=>searchPage(e.target.value));document.addEventListener('click',e=>{let a=e.target.closest('a.wikilink');if(a){e.preventDefault();go(a.dataset.target)}});navSetup();let initial=decodeURIComponent(location.hash.slice(1));go(initial&&byId[initial]?initial:'home');
</script></body></html>
